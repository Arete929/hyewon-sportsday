<!-- 파일명: survey.html | @version 1.0.0 — 서포터즈 모집 설문(학생용). 문항은 관리자 화면 «서포터즈 › 모집 설문»에서 정한다 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>서포터즈 모집 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#1d4ed8;--blue-d:#173ea9;--blue-t:#e8eefc;--ok:#16884f;--ok-t:#e6f5ec;--warn:#b45a09;--warn-t:#fff3e2;--danger:#d63a48;
  --ink:#17211b;--ink2:#2b3a30;--muted:#55645a;--muted2:#7d8a80;--line:#e3e8e3;--line2:#d7ded8;--bg:#f5f7f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
button,input,textarea{font-family:inherit}
.app{max-width:560px;margin:0 auto;padding:18px 16px 28px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top a{font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:40px}
.pt{font-size:12px;font-weight:800;border-radius:999px;padding:4px 11px;background:var(--ok-t);color:var(--ok);white-space:nowrap}
.pt.b{background:var(--blue-t);color:var(--blue-d)}.pt.g{background:#e9ece9;color:var(--muted)}
h1{font-size:25px;font-weight:900;letter-spacing:-.03em;margin:0 0 8px;line-height:1.3}
.intro{margin:0 0 6px;padding-left:20px;color:var(--ink2);font-size:14.5px;line-height:1.7}
.meta{font-size:13px;color:var(--muted);margin:6px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 15px 16px;margin-bottom:10px;transition:border-color .15s}
.card.err{border-color:var(--danger);box-shadow:0 0 0 3px #fdecee}
.card .q{font-size:15.5px;font-weight:800;margin:0 0 3px;display:block}
.card .q em{color:var(--danger);font-style:normal;margin-left:3px}
.card .h{font-size:12.5px;color:var(--muted2);margin:0 0 10px}
.card .q+.inp,.card .q+.ta,.card .q+.chs,.card .q+.two{margin-top:10px}
.inp,.ta{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:0 13px;font-size:16px;background:#fff;color:var(--ink)}
.inp{height:50px}.ta{min-height:110px;padding:12px 13px;line-height:1.55;resize:vertical}
.inp:focus,.ta:focus{border-color:var(--blue);outline:0}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.chs{display:flex;flex-wrap:wrap;gap:7px}
.chs button{min-height:42px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:14.5px;font-weight:700;color:var(--ink2);cursor:pointer;text-align:left;line-height:1.35}
.chs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chs.col{flex-direction:column}.chs.col button{border-radius:12px;width:100%}
.oth{margin-top:8px}
.cnt{font-size:12px;color:var(--muted2);text-align:right;margin-top:4px}
.msg{min-height:22px;color:var(--danger);font-size:14px;font-weight:700;margin:6px 2px 8px}
.go{width:100%;height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:900;font-size:17px;cursor:pointer}
.go:disabled{opacity:.6}
.ben{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.note{background:#fff;border:1px dashed var(--line2);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}
.note b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.done{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 20px;text-align:center}
.done .ck{width:58px;height:58px;border-radius:50%;background:var(--ok-t);display:grid;place-items:center;margin:0 auto 12px}
.done .ck svg{width:30px;height:30px;stroke:var(--ok);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h2{margin:0 0 6px;font-size:21px}.done p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.7}
.done .t{font-size:12.5px;color:var(--muted2);margin-top:10px}
.done .acts{display:grid;gap:8px;margin-top:18px}
.done .acts a,.done .acts button{height:48px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:15px;color:var(--ink2);display:grid;place-items:center;text-decoration:none;cursor:pointer}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#eceeec,#f6f7f6,#eceeec);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.vf{text-align:center;color:var(--muted2);font-size:11.5px;line-height:1.7;padding:24px 0 6px}
.ov{position:fixed;inset:0;background:rgba(15,25,18,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:18px;width:min(380px,100%);padding:20px}
.dlg p{margin:0 0 16px;font-size:16px;line-height:1.6;white-space:pre-wrap}
.dlg button{width:100%;height:46px;border-radius:12px;border:0;font-weight:800;font-size:15px;background:var(--blue);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main class="app" id="app"><div class="sk" style="width:40%"></div><div class="sk" style="height:30px;width:80%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></main>
<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true"><p id="dlgMsg"></p><button id="dlgOk">확인</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLj-YCN1PJIQ5r4KnbaLyeCD997tRVkZoKJQ9Y-Fan75w4xx-4YJjUGsMZ-binoVeN/exec';
const PAGE_VERSION='1.0.0', PAGE_DEPLOYED='2026-11-15 23:55';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const WK='일월화수목금토';
const when=v=>{if(!v)return '';const d=new Date(v+':00+09:00');return `${d.getMonth()+1}월 ${d.getDate()}일 (${WK[d.getDay()]}) ${v.slice(11,16)}`;};
let dlgR=null;
function uiAlert(m){return new Promise(r=>{$('#dlgMsg').textContent=m;$('#ov').classList.add('show');dlgR=r;setTimeout(()=>$('#dlgOk').focus(),30);});}
$('#dlgOk').onclick=()=>{$('#ov').classList.remove('show');const r=dlgR;dlgR=null;r&&r();};
document.addEventListener('keydown',e=>{if($('#ov').classList.contains('show')&&(e.key==='Enter'||e.key==='Escape')){e.preventDefault();$('#dlgOk').click();}});
const footer=()=>`<div class="vf">서포터즈 모집 설문 · v${PAGE_VERSION} · 배포 ${PAGE_DEPLOYED} (KST)<br>ⓒKIMJINHO</div>`;
const back=`<a href="./">‹ 체육의 날 홈</a>`;

let S=null, ANS={};
const WHO=ls.get('sd_who');
async function load(){
  try{const r=await (await fetch(API+'?a=supForm')).json();if(!r.ok)throw new Error(r.msg);S=r.sup;draw();}
  catch(e){$('#app').innerHTML=`<div class="top">${back}</div><div class="note"><b>설문을 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 열어 주세요.<br><button class="go" style="margin-top:16px" onclick="location.reload()">다시 열기</button></div>${footer()}`;}
}
function draw(){
  if(!S||S.state==='hidden'){$('#app').innerHTML=`<div class="top">${back}</div><div class="note"><b>지금은 받는 설문이 없어요</b>서포터즈 모집이 열리면 체육 선생님이 알려 줄 거예요.</div>${footer()}`;return;}
  const intro=String(S.duties||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  const pill=S.state==='open'?`<span class="pt">${S.to?esc(when(S.to))+'까지':'받는 중'}</span>`:S.state==='soon'?`<span class="pt b">${esc(when(S.from))}부터</span>`:'<span class="pt g">마감</span>';
  const q=S.quota||{},qtxt=[3,2,1].every(g=>+q[g]===+q[3])?(+q[3]?'학년마다 '+q[3]+'명':''):[3,2,1].map(g=>g+'학년 '+(+q[g]||0)+'명').join(' · ');
  const head=`<div class="top">${back}${pill}</div><h1>${esc(S.title)}</h1>${intro.length?`<ul class="intro">${intro.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="meta">${qtxt?'뽑는 인원 '+esc(qtxt)+' · ':''}비밀번호 없이 학번과 이름만 적어요</div>`;
  if(S.state!=='open'){$('#app').innerHTML=head+`<div class="note"><b>${S.state==='soon'?'아직 열리지 않았어요':'설문이 마감되었어요'}</b>${S.state==='soon'?esc(when(S.from))+'부터 답할 수 있어요.':'함께해 줘서 고마워요. 뽑힌 학생은 선생님이 알려 줘요.'}</div>${footer()}`;return;}
  const qs=S.qs||[];
  const card=(x,i)=>{const choice=x.type==='one'||x.type==='multi',v=ANS[x.id];
    const hint=x.type==='multi'?(x.max?x.max+'개까지 고를 수 있어요':'여러 개 고를 수 있어요'):x.help||'';
    let body='';
    if(choice){const sel=Array.isArray(v)?v:v?[v]:[];const isOth=sel.some(s=>/^기타: /.test(s))||ANS['_o_'+x.id]!=null;
      const long=x.opts.some(o=>o.length>14);
      body=`<div class="chs ${long?'col':''}" role="${x.type==='one'?'radiogroup':'group'}" aria-labelledby="q_${i}">${x.opts.map(o=>`<button type="button" data-q="${i}" data-o="${esc(o)}" class="${sel.includes(o)?'on':''}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}
        ${x.other?`<button type="button" data-q="${i}" data-oth="1" class="${isOth?'on':''}" aria-pressed="${isOth}">기타</button>`:''}</div>
        ${x.other&&isOth?`<input class="inp oth" data-ot="${i}" maxlength="60" placeholder="기타 — 직접 적어 주세요" value="${esc(ANS['_o_'+x.id]||'')}">`:''}`;}
    else if(x.type==='long')body=`<textarea class="ta" data-t="${i}" maxlength="500" placeholder="한두 줄로 적어 주세요" aria-labelledby="q_${i}">${esc(v||'')}</textarea><div class="cnt" id="cnt${i}">${String(v||'').length}/500</div>`;
    else if(x.type==='date')body=`<input class="inp" type="date" data-t="${i}" value="${esc(v||'')}" aria-labelledby="q_${i}">`;
    else body=`<input class="inp" data-t="${i}" maxlength="100" placeholder="답을 적어 주세요" value="${esc(v||'')}" aria-labelledby="q_${i}">`;
    return `<div class="card" id="c${i}"><span class="q" id="q_${i}">${esc(x.text)}${x.req?'<em aria-label="꼭 답해야 해요">*</em>':''}</span>${hint?`<p class="h">${esc(hint)}</p>`:''}${body}</div>`;};
  $('#app').innerHTML=head+`<form id="f" novalidate>
    <div class="card" id="cWho"><span class="q">학번 · 이름<em>*</em></span><p class="h">학번 4자리 (예: 2105)</p><div class="two"><input class="inp" id="sid" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="학번" value="${esc(ANS._sid!=null?ANS._sid:WHO?WHO.sid:'')}" aria-label="학번 4자리"><input class="inp" id="nm" maxlength="10" autocomplete="off" placeholder="이름" value="${esc(ANS._nm!=null?ANS._nm:WHO?WHO.name:'')}" aria-label="이름"></div></div>
    ${qs.map(card).join('')}
    <div class="msg" id="msg" role="alert"></div><button class="go" id="go" type="submit">설문 보내기</button>${S.benefit?`<div class="ben">${esc(S.benefit)}</div>`:''}</form>${footer()}`;
  bind();
}
function bind(){
  const qs=S.qs||[];
  $('#sid').oninput=e=>{ANS._sid=e.target.value.replace(/\D/g,'');e.target.value=ANS._sid;};
  $('#nm').oninput=e=>{ANS._nm=e.target.value;};
  $('#app').querySelectorAll('[data-o],[data-oth]').forEach(b=>b.onclick=()=>{const x=qs[+b.dataset.q],o=b.dataset.o,oth=!!b.dataset.oth;
    if(x.type==='one'){if(oth){ANS[x.id]=null;ANS['_o_'+x.id]=ANS['_o_'+x.id]||'';}else{ANS[x.id]=ANS[x.id]===o?null:o;delete ANS['_o_'+x.id];}}
    else{let a=(ANS[x.id]||[]).slice();
      if(oth){if(ANS['_o_'+x.id]!=null)delete ANS['_o_'+x.id];else ANS['_o_'+x.id]='';}
      else{if(a.includes(o))a=a.filter(z=>z!==o);else{if(x.max&&a.length+(ANS['_o_'+x.id]!=null?1:0)>=x.max){toast(x.max+'개까지 고를 수 있어요');return;}a.push(o);}}
      ANS[x.id]=a;}
    $('#c'+b.dataset.q).classList.remove('err');keep();});
  $('#app').querySelectorAll('[data-ot]').forEach(i=>i.oninput=()=>{ANS['_o_'+qs[+i.dataset.ot].id]=i.value;});
  $('#app').querySelectorAll('[data-t]').forEach(i=>i.oninput=()=>{const k=+i.dataset.t;ANS[qs[k].id]=i.value;const c=$('#cnt'+k);if(c)c.textContent=i.value.length+'/500';$('#c'+k).classList.remove('err');});
  $('#f').onsubmit=e=>{e.preventDefault();send();};
}
function keep(){const y=scrollY,a=document.activeElement,id=a&&a.dataset&&a.dataset.q!=null?[a.dataset.q,a.dataset.o||'',a.dataset.oth||'']:null;draw();scrollTo(0,y);
  if(id){const b=$(`[data-q="${id[0]}"]${id[2]?'[data-oth]':`[data-o="${CSS.escape(id[1])}"]`}`);b&&b.focus({preventScroll:true});}
  const o=document.querySelector('[data-ot]');if(o&&!o.value&&document.activeElement&&document.activeElement.dataset.oth)o.focus({preventScroll:true});}
let tt;function toast(m){$('#msg').textContent=m;clearTimeout(tt);tt=setTimeout(()=>{$('#msg').textContent='';},2500);}
async function send(){
  const qs=S.qs||[],sid=String(ANS._sid!=null?ANS._sid:$('#sid').value).trim(),name=String(ANS._nm!=null?ANS._nm:$('#nm').value).trim();
  document.querySelectorAll('.card.err').forEach(c=>c.classList.remove('err'));
  const bad=(id,m)=>{const c=$(id);c.classList.add('err');c.scrollIntoView({block:'center',behavior:'smooth'});$('#msg').textContent=m;};
  if(!/^\d{4}$/.test(sid)||!name)return bad('#cWho','학번 4자리와 이름을 넣어 주세요.');
  const ans={};
  for(let i=0;i<qs.length;i++){const x=qs[i];let v=ANS[x.id];const ot=String(ANS['_o_'+x.id]||'').trim();
    if(x.type==='multi'){v=(v||[]).slice();if(ANS['_o_'+x.id]!=null&&ot)v.push('기타: '+ot);}
    else if(x.type==='one'){if(ANS['_o_'+x.id]!=null)v=ot?'기타: '+ot:'';}
    else v=String(v||'').trim();
    const empty=Array.isArray(v)?!v.length:!v;
    if(x.req&&empty)return bad('#c'+i,`«${x.text}»에 ${x.type==='multi'||x.type==='one'?'골라':'답해'} 주세요.`);
    if(!empty)ans[x.id]=v;}
  const b=$('#go');b.disabled=true;b.textContent='보내는 중…';$('#msg').textContent='';
  try{const r=await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'supApply',sid,name,ans})})).json();
    if(!r.ok){b.disabled=false;b.textContent='설문 보내기';$('#msg').textContent=r.msg;if(/명단|학번|이름/.test(r.msg))bad('#cWho',r.msg);return;}
    ls.set('sd_who',{sid,name:r.name});
    $('#app').innerHTML=`<div class="top">${back}</div><div class="done"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>${esc(r.name)} 학생, ${r.again?'답을 고쳤어요':'잘 받았어요'}</h2><p>뽑히면 체육 선생님이 알려 줘요.<br>${S.to?esc(when(S.to))+'까지는':'설문 기간 안에는'} 다시 보내서 고칠 수 있어요.</p><div class="t">보낸 시각 ${esc(r.savedAt)}</div>
      <div class="acts"><button type="button" id="again">답 고치기</button><a href="./">체육의 날 홈으로</a></div></div>${footer()}`;
    $('#again').onclick=()=>{draw();scrollTo(0,0);};}
  catch(e){b.disabled=false;b.textContent='설문 보내기';$('#msg').textContent='연결이 안 돼요. 다시 눌러 주세요.';}
}
load();
</script>
</body>
</html>
