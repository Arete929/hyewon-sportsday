<!-- 파일명: index.html | @version 3.4.1 — 학생 배부용 사이트: 홈·시간표·선수 명단·점수판(대진표)·반티 모아 보기·응원 음원 추천 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>혜원 체육의 날</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#1d4ed8;--blue-d:#173ea9;--blue-t:#e8eefc;--ok:#16884f;--ok-t:#e6f5ec;--warn:#b45a09;--warn-t:#fff3e2;--danger:#d63a48;
  --ink:#17211b;--ink2:#2b3a30;--muted:#55645a;--muted2:#7d8a80;--line:#e3e8e3;--line2:#d7ded8;--bg:#f5f7f4;--team:#1d4ed8;--teamInk:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--blue);color:#fff}
html,body{margin:0;background:var(--bg)}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100vh}
/* 머리 — 반티 색 */
.hero{background:var(--team);color:var(--teamInk);padding:22px 20px 46px;position:relative}
.hero .cls{font-size:13px;font-weight:700;opacity:.9}
.hero h1{margin:2px 0 0;font-size:30px;font-weight:900;letter-spacing:-.03em}
.hero .me{font-size:14px;opacity:.95;margin-top:2px}
.hero .dd{position:absolute;right:18px;top:20px;text-align:right}
.hero .dd b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em}
.hero .dd small{font-size:12px;opacity:.9}
.tee{position:absolute;right:14px;bottom:-28px;width:78px;height:78px;border-radius:18px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}
.tee img{width:100%;height:100%;object-fit:cover}
.tee svg{width:54px;height:54px}
.body{padding:16px 16px 20px}
.sec{margin-top:18px}
.sec h2{font-size:15px;font-weight:800;margin:0 0 9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.mine{display:flex;flex-direction:column;gap:8px}
.ev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center}
.ev .t{width:52px;text-align:center;font-weight:800;font-size:13px;color:var(--blue-d)}
.ev .t small{display:block;color:var(--muted2);font-weight:600;font-size:11px}
.ev b{font-size:15.5px}
.ev p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.none{background:#fff;border:1px dashed var(--line2);border-radius:14px;padding:14px;color:var(--muted);font-size:13.5px}
.tl{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tl li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.tl li:first-child{border-top:0}
.tl .tm{width:46px;color:var(--muted2);font-weight:700;font-size:12.5px;flex:none}
.tl li.me{background:var(--blue-t)}
.tl li.me b{color:var(--blue-d)}
.tl .pill{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--blue);color:#fff;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{display:flex;width:100%;max-width:520px;height:62px}
.tabs button{flex:1;border:0;background:transparent;font-weight:700;font-size:11.5px;color:var(--muted2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9}
.tabs button.on{color:var(--blue)}
/* 로그인 */
.login{padding:28px 20px}
.login h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.03em}
.login p{color:var(--muted);margin:4px 0 18px;font-size:14px}
.inp{width:100%;height:50px;border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;font-size:17px;background:#fff;margin-bottom:10px}
.inp:focus{border-color:var(--blue);outline:0}
.big{width:100%;height:52px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.big.blue{background:var(--blue)}
.big:disabled{opacity:.5}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer}
.msg{color:var(--danger);font-size:13.5px;font-weight:700;min-height:20px;margin-bottom:6px}
/* 점수판 */
.sb-h{background:#121a15;color:#fff;padding:20px 18px 16px}
.sb-h h1{margin:0;font-size:22px;font-weight:900}
.sb-h small{color:#a9b4ac;font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#ff6b62;margin-top:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#ff6b62;animation:p 1.6s ease-out infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,107,98,.6)}100%{box-shadow:0 0 0 9px rgba(255,107,98,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.gpal{display:flex;gap:6px;padding:12px 16px 0}
.gpal button{flex:1;height:40px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.gpal button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rank{padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.rk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.rk .n{font-size:20px;font-weight:900;color:var(--muted2);text-align:center}
.rk.first .n{color:#c58a00}
.rk.mine{border:2px solid var(--blue)}
.rk b{font-size:16px}
.rk .bar{height:6px;border-radius:6px;background:#eef1ee;margin-top:6px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--blue)}
.rk .pt{font-size:20px;font-weight:900;letter-spacing:-.02em}
.rk .pt small{font-size:11.5px;color:var(--muted2);font-weight:700;margin-left:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:#f1f3f1;color:var(--muted)}
.chips span.w{background:#fff4d6;color:#8a5a00}
.note{margin:14px 16px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:13.5px;color:var(--muted)}
/* 대진표 */
.bk{margin:12px 16px 0}
.bk h3{font-size:15px;margin:0 0 8px}
.order{display:flex;gap:6px;align-items:center}.order+.order{margin-top:6px}
.order .gl{flex:none;width:58px;font-size:12px;color:var(--muted);font-weight:800}
.order span{flex:1;height:42px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.order span.me{border-color:var(--blue);background:var(--blue);color:#fff}
.order span.e{border-style:dashed;color:var(--muted2);font-weight:600}
.games{font-size:12.5px;color:var(--muted);margin-top:6px}
/* 반 대표 */
.rp-h{background:#fff;padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.rp-h h1{margin:0;font-size:20px;font-weight:900}
.rp-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.cpal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.cpal button{height:42px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--ink2);cursor:pointer}
.cpal button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.evpal{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px}
.evpal::-webkit-scrollbar{height:0}
.evpal button{flex:none;height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.evpal button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.evpal button em{font-style:normal;font-weight:800;margin-left:4px;opacity:.85}
.need{margin:8px 16px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.need b{font-size:15px}
.need .ok{color:var(--ok);font-weight:800}
.picked{margin:8px 16px 0;display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:8px;border-radius:12px;background:var(--blue-t)}
.picked span{height:30px;display:inline-flex;align-items:center;padding:0 11px;border-radius:999px;background:var(--blue);color:#fff;font-size:13px;font-weight:700}
.picked em{font-style:normal;color:var(--muted2);font-size:13px;align-self:center;padding-left:4px}
.roster{margin:12px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.roster button{height:50px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-weight:700;font-size:14px;color:var(--ink2);line-height:1.15;cursor:pointer}
.roster button small{display:block;font-size:10.5px;color:var(--muted2);font-weight:600}
.roster button.on{border-color:var(--blue);background:var(--blue-t);color:var(--blue-d)}
.roster button.no{opacity:.4;text-decoration:line-through}
.roster button.cf{border-color:#f1c27a;background:var(--warn-t)}
.rule{margin:12px 16px 0;font-size:12.5px;color:var(--warn);background:var(--warn-t);border-radius:10px;padding:9px 11px;line-height:1.5}
.save{margin:14px 16px 4px;width:calc(100% - 32px)}
.savedat{text-align:center;font-size:12.5px;color:var(--muted2);margin:6px 0 10px}
.savedat.ok{color:var(--ok);font-weight:700}
.bantiBox{margin:12px 16px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.bantiBox .ph{width:100%;aspect-ratio:1/1;border-radius:12px;background:#f3f5f3;display:grid;place-items:center;overflow:hidden;margin-bottom:12px;color:var(--muted2);font-weight:700}
.bantiBox .ph img{width:100%;height:100%;object-fit:cover}
.bantiBox label{display:block}
.bantiBox input{display:none}
.vf{text-align:center;color:var(--muted2);font-size:11.5px;line-height:1.7;padding:22px 0 18px}
.loading{padding:60px 20px;text-align:center;color:var(--muted2)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(15,25,18,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:18px;width:min(380px,100%);padding:20px}
.dlg p{margin:0 0 16px;font-size:16px;line-height:1.6;white-space:pre-wrap}
.dlg .acts{display:flex;gap:8px}
.dlg .acts button{flex:1;height:46px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.dlg .ok{background:var(--blue);color:#fff}.dlg .no{background:#eef1ee;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .2s ease-out;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── 2.0 더한 것 ── */
.tabs button{font-size:11px}
.seg{display:flex;margin:12px 16px 0;background:#e9ede9;border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ph-h{background:#fff;padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.ph-h h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.02em}
.ph-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.nowc{background:#fff;border:2px solid var(--danger);border-radius:14px;padding:12px 14px;display:flex;gap:11px;align-items:center}
.nowc .tag{flex:none;font-size:11px;font-weight:800;background:var(--danger);color:#fff;border-radius:999px;padding:2px 8px}
.nowc b{font-size:15.5px}.nowc p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.mini small{font-size:12px;color:var(--muted2);font-weight:700}
.mini b{display:block;font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.mini em{font-style:normal;font-size:12px;color:var(--muted)}
.more{display:flex;gap:8px;margin-top:8px}
.more a,.more button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;font-family:inherit}
/* 시간표 */
.tt{list-style:none;margin:12px 16px 0;padding:0}
.tt li{display:grid;grid-template-columns:48px 1fr;gap:10px}
.tt .tm{font-size:12.5px;font-weight:800;color:var(--muted2);padding-top:10px;text-align:right}
.tt .bx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.tt .bx b{font-size:14.5px}
.tt .bx p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.tt .done .bx{opacity:.5}
.tt .live .bx{border:2px solid var(--danger);background:#fff6f6}
.tt .live .tm{color:var(--danger)}
.tt .mine .bx{background:var(--blue-t);border-color:#b9cbf5}
.tt .mine.live .bx{border-color:var(--danger)}
.pl{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.pl.r{background:var(--danger);color:#fff}.pl.b{background:var(--blue);color:#fff}
/* 선수 명단 */
.chipr{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0}
.chipr::-webkit-scrollbar{height:0}
.chipr button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chipr button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chipr.blue button.on{background:var(--blue);border-color:var(--blue)}
.plist{padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.pc.mine{border:2px solid var(--blue)}
.pc h3{margin:0 0 7px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.pc h3 small{font-size:12px;color:var(--muted2);font-weight:700}
.pc .nm{display:flex;flex-wrap:wrap;gap:5px}
.pc .nm span{font-size:13px;font-weight:700;background:#f1f3f1;border-radius:8px;padding:3px 9px}
.pc .nm span.me{background:var(--blue);color:#fff}
.pc .nm em{font-style:normal;font-size:13px;color:var(--muted2)}
/* 점수판 반티 칸 */
.rk{grid-template-columns:30px 40px 1fr auto}
.rk .sw{width:40px;height:40px;border-radius:10px;background:#f1f3f1;display:grid;place-items:center;overflow:hidden}
.rk .sw img{width:100%;height:100%;object-fit:cover}
.rk .sw svg{width:30px;height:30px}
/* 반티 모아 보기 */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.gc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.gc .im{aspect-ratio:1/1;display:grid;place-items:center;background:#f3f5f3;color:var(--muted2);font-size:12.5px;font-weight:700;overflow:hidden}
.gc .im img{width:100%;height:100%;object-fit:cover}
.gc .im svg{width:56%;height:56%}
.gc .cap{padding:8px 11px;display:flex;justify-content:space-between;align-items:center}
.gc .cap b{font-size:15px;color:var(--ink)}
.gc .cap em{font-style:normal;font-size:11.5px;color:var(--muted2);font-weight:700}
.gc.mine{border:2px solid var(--blue)}
.big-ph{position:fixed;inset:0;background:rgba(10,14,12,.92);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.big-ph.show{display:flex}
.big-ph img{max-width:100%;max-height:78vh;border-radius:14px;background:#222}
.big-ph b{color:#fff;font-size:18px}
.big-ph button{height:44px;padding:0 22px;border-radius:999px;border:0;background:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
/* 음원 */
.sl{padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.sg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:96px 1fr auto;gap:11px;align-items:center}
.sg.hl{border:2px solid var(--warn);background:var(--warn-t)}
.sg .th{width:96px;height:54px;border-radius:9px;overflow:hidden;position:relative;display:block;background:#e9ede9}
.sg .th img{width:100%;height:100%;object-fit:cover;display:block}
.sg .th.no{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted2);text-decoration:none}
.sg .th i{position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.sg b{font-size:14px;display:block;line-height:1.3;word-break:keep-all}
.sg p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.sg .tg{font-size:10.5px;font-weight:800;color:var(--ok);background:var(--ok-t);border-radius:5px;padding:0 5px;margin-left:4px;white-space:nowrap}
.lk{width:50px;height:50px;border-radius:13px;border:1.5px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
.lk svg{width:18px;height:18px}
.lk.on{border-color:var(--danger);background:#fff1f2;color:var(--danger)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;border:0;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(0,0,0,.22);z-index:6;cursor:pointer;font-family:inherit}
.sheet-ov{position:fixed;inset:0;background:rgba(15,25,18,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-ov.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .gr{width:40px;height:4px;border-radius:4px;background:#d5dbd6;margin:0 auto 12px}
.sheet h3{margin:0;font-size:19px;font-weight:900}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.fl{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
.sheet .inp{margin-bottom:0;font-size:16px}
.pv{margin-top:8px;display:none;grid-template-columns:104px 1fr;gap:10px;align-items:center;background:var(--ok-t);border-radius:12px;padding:8px}
.pv.show{display:grid}
.pv img{width:104px;height:58px;border-radius:8px;object-fit:cover;display:block}
.pv b{font-size:13px;color:var(--ok)}.pv p{margin:0;font-size:12px;color:var(--muted)}
.lim{text-align:center;font-size:12px;color:var(--muted2);margin-top:8px}
.sheet .acts{display:flex;gap:8px;margin-top:14px}
.sheet .acts button{flex:1;height:50px;border-radius:13px;border:0;font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit}
.sheet .acts .no{background:#eef1ee;color:var(--ink2);flex:.5}
.sheet .acts .go{background:var(--blue);color:#fff}
.sheet .acts .go:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}.two .inp{margin:0}
.mycls{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.mycls .t{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px}
.clsr{display:flex;gap:5px;margin-top:8px}
.clsr button{flex:1;min-width:0;height:40px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:clamp(12px,3.6vw,14px);color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:inherit}
.clsr button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pl.g{background:#e3e7e4;color:var(--muted)}
.rolep{display:flex;flex-wrap:wrap;gap:6px}
.rolep button{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--ink2);cursor:pointer;font-family:inherit}
.rolep button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{margin:14px 16px 0;padding:22px 16px;background:#fff;border:1px dashed var(--line2);border-radius:14px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">불러오는 중…</div></div>
<nav class="tabs" id="tabs"><div>
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>홈</button>
  <button data-t="time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>시간표·선수</button>
  <button data-t="score"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4"/></svg>점수판</button>
  <button data-t="banti"><svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 01-8 0z"/></svg>반티</button>
  <button data-t="song"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>음원</button>
</div></nav>
<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true"><p id="dlgMsg"></p><div class="acts"><button class="no" id="dlgNo">취소</button><button class="ok" id="dlgOk">확인</button></div></div></div>
<div class="big-ph" id="bigPh"><b id="bigT"></b><img id="bigI" alt=""><button id="bigX">닫기</button></div>
<div class="sheet-ov" id="sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="gr"></div><h3 id="shT">노래 추천하기</h3><div class="sub">경기 사이·점심시간에 틀 노래를 추천해 주세요</div>
  <label class="fl" for="sgUrl">유튜브 링크 <span style="color:var(--muted2);font-weight:600">(없어도 돼요)</span></label>
  <input class="inp" id="sgUrl" inputmode="url" autocomplete="off" placeholder="유튜브 «공유 → 링크 복사» 후 붙여 넣기">
  <div class="pv" id="sgPv"><img id="sgPvI" alt=""><div><b>✓ 영상 찾았어요</b><p>맞는 영상인지 확인해 주세요</p></div></div>
  <label class="fl" for="sgTitle">노래 제목</label><input class="inp" id="sgTitle" maxlength="60" autocomplete="off" placeholder="예: Supernova">
  <label class="fl" for="sgArtist">가수</label><input class="inp" id="sgArtist" maxlength="40" autocomplete="off" placeholder="예: aespa">
  <label class="fl">추천한 사람 <span style="color:var(--muted2);font-weight:600">(다른 학생에게는 반만 보여요)</span></label>
  <div class="two"><input class="inp num" id="sgSid" inputmode="numeric" maxlength="4" placeholder="학번 4자리" autocomplete="off"><input class="inp" id="sgName" placeholder="이름" autocomplete="off"></div>
  <div class="msg" id="sgMsg" style="margin:8px 0 0"></div>
  <div class="acts"><button class="no" id="sgNo">닫기</button><button class="go" id="sgGo">추천 보내기</button></div>
  <div class="lim" id="sgLim"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxLj-YCN1PJIQ5r4KnbaLyeCD997tRVkZoKJQ9Y-Fan75w4xx-4YJjUGsMZ-binoVeN/exec';
const PAGE_VERSION='3.4.1', PAGE_DEPLOYED='2026-11-27 10:58';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* 구글 계정 쿠키 없이 부른다(크로스오리진 fetch) — POST 는 text/plain 이라 preflight 가 없다 */
async function get(a,q){const u=API+'?a='+a+(q?'&'+new URLSearchParams(q):'');const r=await fetch(u);return r.json();}
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json();}

let dlgRes=null;
function uiDialog(m,cancel){return new Promise(r=>{$('#dlgMsg').textContent=m;$('#dlgNo').style.display=cancel?'':'none';$('#ov').classList.add('show');dlgRes=r;setTimeout(()=>$('#dlgOk').focus(),30);});}
function dlgClose(v){$('#ov').classList.remove('show');const r=dlgRes;dlgRes=null;r&&r(v);}
$('#dlgOk').onclick=()=>dlgClose(true);$('#dlgNo').onclick=()=>dlgClose(false);
document.addEventListener('keydown',e=>{
  if($('#ov').classList.contains('show')){if(e.key==='Enter'){e.preventDefault();dlgClose(true);}if(e.key==='Escape'){e.preventDefault();dlgClose(false);}return;}
  if(e.key==='Escape'){if($('#bigPh').classList.contains('show'))$('#bigPh').classList.remove('show');else if($('#sheet').classList.contains('show'))closeSheet();}});
const uiAlert=m=>uiDialog(m,false), uiConfirm=m=>uiDialog(m,true);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* 로그인 없음 — MYK: 고른 우리 반(이 기기에만), WHO: 추천·신청 때 적은 학번·이름(다음에 미리 채우기), DEV: 하트용 기기 번호 */
ls.del('sd_me');
let B=null, MYK=ls.get('sd_myk'), WHO=ls.get('sd_who'), TAB=ls.get('sd_tab')||'home', G=MYK?MYK[0]:'1', SUB='time', SCO='score', PEV='relay', SGV='likes';
let DEV=ls.get('sd_dev');if(!DEV){DEV=Array.from({length:16},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.random()*32|0]).join('');ls.set('sd_dev',DEV);}
let SONGS=null, PLAYERS=null, SG_FRESH='', SG_HL=0;
const PH={};

/* ───── 공통 계산 ───── */
/* 학년별 참여 학급 — 관리자 설정 «행사·일정» */
const CNs=g=>Array.from({length:Math.min(5,Math.max(1,+((B.cfg.classN||{})[g])||5))},(_,i)=>i+1);
const EVN=k=>((B&&B.events.find(e=>e.key===k))||{name:k==='tug'?'줄다리기':k}).name;
const WK='일월화수목금토';
function kst(){const n=new Date(Date.now()+9*36e5);return {d:n.toISOString().slice(0,10),m:n.getUTCHours()*60+n.getUTCMinutes()};}
function dday(){const d=B&&B.cfg.eventDate;if(!d)return null;return Math.round((Date.parse(d)-Date.parse(kst().d))/864e5);}
function fmtLong(d){if(!d)return '';const t=new Date(d+'T12:00:00+09:00');return `${t.getMonth()+1}월 ${t.getDate()}일 (${WK[t.getDay()]})`;}
/* 프로그램 줄이 내 종목인지 — «이어달리기 예선», «2인3각 달리기», «판 뒤집기» 처럼 띄어쓰기가 달라도 */
const norm=s=>String(s).replace(/\s/g,'');
function progFor(k){const n=norm(EVN(k));return (B.program||[]).filter(p=>norm(p.name).indexOf(n)>=0);}
const shirt=c=>`<svg viewBox="0 0 48 48"><path d="M17 6l-10 6 4 8 4-2v24h18V18l4 2 4-8-10-6a7 7 0 01-14 0z" fill="${c}" stroke="rgba(0,0,0,.18)" stroke-width="1.2"/></svg>`;
const hm=s=>{const m=String(s||'').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
function span(p){const t=String(p.time||''),a=hm(t),m=t.match(/[-~]\s*(\d{1,2}:\d{2})/);return {a,b:m?hm(m[1]):null,start:(t.match(/\d{1,2}:\d{2}/)||[''])[0]};}
/* 행사 날이면 진행 상태 — 'done' | 'live' | '' */
function progState(p){if(!B.cfg.eventDate)return '';const k=kst();if(k.d<B.cfg.eventDate)return '';if(k.d>B.cfg.eventDate)return 'done';
  const s=span(p);if(s.a==null)return '';if(k.m<s.a)return '';if(s.b==null?k.m<s.a+20:k.m<s.b)return 'live';return 'done';}   // 끝 시각이 없는 순서(«13:30~»)는 20분 동안만 진행 중
function whoTxt(w){w=(w||[]).map(x=>String(x||'').trim());if(w[0]&&!w[1]&&!w[2])return w[0];
  if(/^\d+$/.test(w[0])&&w[0]===w[1]&&w[1]===w[2])return '학년마다 '+w[0]+'명';
  return w.map((x,i)=>x?(i+1)+'학년 '+x+(/^\d+$/.test(x)?'명':''):'').filter(Boolean).join(' · ');}

/* 반티 사진 → 화면 색 (사진에서 가장 많이 쓰인 진한 색) */
async function photo(fid,size){if(!fid)return null;const k=fid+(size||'');if(PH[k])return PH[k];
  try{const r=await get('photo',size?{fid,size}:{fid});if(r.ok){PH[k]=`data:${r.mime};base64,${r.base64}`;return PH[k];}}catch(e){}return null;}
function teamColor(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(im,0,0,32,32);
  const d=x.getImageData(0,0,32,32).data,bins={};for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<40||mx<50)continue;const k=(r>>5)+','+(g>>5)+','+(b>>5);(bins[k]=bins[k]||[0,0,0,0]);bins[k][0]+=r;bins[k][1]+=g;bins[k][2]+=b;bins[k][3]++;}
  const best=Object.values(bins).sort((a,b)=>b[3]-a[3])[0];if(!best||best[3]<20){res(null);return;}
  let [r,g,b]=[best[0]/best[3],best[1]/best[3],best[2]/best[3]];const l=.299*r+.587*g+.114*b;if(l>165){const k=150/l;r*=k;g*=k;b*=k;}
  res(`rgb(${r|0},${g|0},${b|0})`);};im.onerror=()=>res(null);im.src=src;});}

/* ───── 탭 ───── */
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
const NEWSITE={home:'go.html',banti:'go.html#banti'};
function go(t){if(NEWSITE[t]){location.href=NEWSITE[t];return;}TAB=t;ls.set('sd_tab',t);draw();scrollTo(0,0);}
function draw(){
  if(!['home','time','score','banti','song'].includes(TAB))TAB='home';
  if(NEWSITE[TAB]){ls.set('sd_tab','time');location.replace(NEWSITE[TAB]);return;}
  $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  ({home:vHome,time:vTime,score:vScore,banti:vBanti,song:vSong})[TAB]();
}
const footer=()=>`<div class="vf"><span id="ft">혜원 체육의 날</span> · v${PAGE_VERSION} · 배포 ${PAGE_DEPLOYED} (KST)<br>ⓒKIMJINHO</div>`;
const gchips=(fn)=>`<div class="chipr">${['1','2','3'].map(g=>`<button data-g="${g}" class="${G===g?'on':''}">${g}학년</button>`).join('')}</div>`;
function bindG(fn){$('#app').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{G=b.dataset.g;fn();});}
function bindGo(){$('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}

/* ═══ 홈 — 공개 자료라 로그인 없이. «우리 반»은 고르면 이 기기에 기억만 한다 ═══ */
function ddHTML(){const dd=dday();return `<b class="num">${dd==null?'':dd>0?'D-'+dd:dd===0?'D-DAY':''}</b><small>${esc(fmtLong(B.cfg.eventDate))}</small>`;}
let PICK_G=null;
async function vHome(){
  const k=MYK,bt=k?(B.banti||{})[k]||{}:{};
  const P=B.program||[],live=P.find(p=>progState(p)==='live'),next=P.find(p=>progState(p)===''&&(kst().d===B.cfg.eventDate));
  const sr=k?(B.scores.rows||{})[k]:null;
  const g0=PICK_G||(k?k[0]:'');
  const picker=`<div class="mycls"><div class="t">${k?'우리 반 바꾸기':'우리 반을 고르면 순위와 반티를 먼저 보여 줘요'}</div>
    <div class="chipr" style="margin:0;padding:0">${['1','2','3'].map(g=>`<button data-pg="${g}" class="${g0===g?'on':''}">${g}학년</button>`).join('')}</div>
    ${g0?`<div class="clsr">${CNs(g0).map(n=>`<button data-pk="${g0}-${n}" class="${k===g0+'-'+n?'on':''}">${n}반</button>`).join('')}</div>`:''}</div>`;
  $('#app').innerHTML=`<div class="hero"><div class="cls">${esc(B.year)} 혜원여자중학교</div><h1 id="htitle">${k?esc(k):'혜원 체육의 날'}</h1><div class="me">${esc(fmtLong(B.cfg.eventDate)+' '+B.cfg.startTime+' · '+B.cfg.place)}</div>
    <div class="dd">${ddHTML()}</div>${k?`<div class="tee" id="tee">${bt.fid&&B.cfg.bantiShow?'':shirt('#dfe5df')}</div>`:''}</div>
    <div class="body">
    ${live?`<div class="sec"><h2>지금 하는 경기</h2><div class="nowc"><span class="tag">진행 중</span><div><b>${esc(live.name)}</b><p>${esc(live.time)} · ${esc(whoTxt(live.who))}</p></div></div></div>`:''}
    ${k?`<div class="sec"><h2>우리 반</h2><div class="mini">
      <div><small>학년 순위</small><b class="num">${B.scores.started&&sr&&sr.rank?esc(sr.rank)+'위':'경기 전'}</b><em>${B.scores.started&&sr?sr.total+'점':'당일 점수가 올라와요'}</em></div>
      <div><small>${next?'다음 순서':'시작'}</small><b class="num">${esc(next?span(next).start:B.cfg.startTime)}</b><em>${esc(next?next.name:B.cfg.place)}</em></div></div>
      ${bt.teacher?`<div class="card" style="font-size:13.5px;color:var(--muted);margin-top:8px">담임 ${esc(bt.teacher)} 선생님</div>`:''}</div>`:''}
    <div class="sec">${picker}</div>
    <div class="sec"><div class="more"><button data-go="time">시간표 ›</button><button id="toPl">${k?'우리 반 선수 명단':'종목별 선수 명단'} ›</button></div>
      <div class="more"><button data-go="score">점수판·대진표 ›</button><button data-go="song">응원 음원 추천 ›</button></div></div></div>${footer()}`;
  bindGo();
  $('#toPl').onclick=()=>{SUB='players';if(k)G=k[0];go('time');};
  $('#app').querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{PICK_G=b.dataset.pg;vHome();});
  $('#app').querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const v=b.dataset.pk;MYK=MYK===v?null:v;if(MYK){ls.set('sd_myk',MYK);G=MYK[0];}else ls.del('sd_myk');PICK_G=null;vHome();});
  if(k&&bt.fid&&B.cfg.bantiShow){const src=await photo(bt.fid);if(src&&$('#tee')){$('#tee').innerHTML=`<img alt="${esc(k)} 반티" src="${src}">`;
    const c=await teamColor(src);if(c)document.documentElement.style.setProperty('--team',c);}}
}

/* ═══ 시간표 · 선수 명단 ═══ */
function vTime(){
  const head=`<div class="ph-h"><h1 id="htitle">${SUB==='time'?'오늘 시간표':'종목별 선수 명단'}</h1><p>${SUB==='time'?esc(fmtLong(B.cfg.eventDate)+' · '+B.cfg.place+' · '+B.cfg.startTime+' 시작')+' · 전교생 같은 순서':'반 대표가 등록한 선수'+(MYK?' · 우리 반은 파란 테두리':'')}</p></div>
    <div class="seg"><button data-s="time" class="${SUB==='time'?'on':''}">시간표</button><button data-s="players" class="${SUB==='players'?'on':''}">선수 명단</button></div>`;
  const bindS=()=>$('#app').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{SUB=b.dataset.s;vTime();});
  if(SUB==='time'){
    const li=(B.program||[]).map(p=>{const st=progState(p);
      return `<li class="${st}"><div class="tm num">${esc(span(p).start)}</div><div class="bx"><b>${esc(p.name)}${st==='live'?'<span class="pl r">진행 중</span>':''}</b><p>${esc(p.time)}${whoTxt(p.who)?' · '+esc(whoTxt(p.who)):''}</p></div></li>`;}).join('');
    $('#app').innerHTML=head+`<ul class="tt">${li||'<li><div></div><div class="bx">시간표가 아직 없어요</div></li>'}</ul>
      ${B.cfg.eventDate&&kst().d===B.cfg.eventDate?'<div class="note">지난 순서는 흐리게, 지금 순서는 빨간 테두리로 보여요. 진행에 따라 조금씩 달라질 수 있어요.</div>':''}${footer()}`;
    bindS();return;
  }
  if(!PLAYERS){$('#app').innerHTML=head+'<div class="loading">선수 명단 불러오는 중…</div>'+footer();bindS();
    post({a:'players'}).then(r=>{if(!r.ok){uiAlert(r.msg);return;}PLAYERS=r.players;if(TAB==='time'&&SUB==='players')vTime();}).catch(()=>toast('연결이 안 돼요'));return;}
  const ev=B.events.find(e=>e.key===PEV)||B.events[0];
  const cards=CNs(G).map(n=>{const k=G+'-'+n,ns=((PLAYERS[k]||{})[ev.key])||[];
    return `<div class="pc ${MYK===k?'mine':''}"><h3>${esc(k)}${MYK===k?' <span class="pl b">우리 반</span>':''}<small class="num">${ns.length}/${ev.q&&ev.q[k]!=null?ev.q[k]:ev.quota}명</small></h3>
      <div class="nm">${ns.length?ns.map(x=>`<span>${esc(x)}</span>`).join(''):'<em>아직 등록 전이에요</em>'}</div></div>`;}).join('');
  $('#app').innerHTML=head+`<div class="chipr blue">${B.events.map(e=>`<button data-e="${e.key}" class="${e.key===ev.key?'on':''}">${esc(e.name)}</button>`).join('')}</div>${gchips()}
    <div class="plist">${cards}</div><div class="note">${(B.evAll||[]).filter(e=>e.type==='all').map(e=>esc(e.name)).join('·')?(B.evAll||[]).filter(e=>e.type==='all').map(e=>esc(e.name)).join('·')+'은(는) 반 전체가 나가요. ':''}명단이 바뀌면 새로 열 때 반영돼요.</div>${footer()}`;
  bindS();bindG(vTime);
  $('#app').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{PEV=b.dataset.e;vTime();});
}

/* ═══ 점수판 · 대진표 ═══ */
async function refresh(){try{const r=await get('boot');if(r.ok){B=r;if(TAB==='score'&&SCO==='score')vScore();}}catch(e){}}
function vScore(){
  const seg=`<div class="seg" style="margin:0;border-radius:0;padding:6px 16px 8px;background:#121a15"><button data-c="score" class="${SCO==='score'?'on':''}" style="${SCO==='score'?'':'color:#a9b4ac'}">점수</button><button data-c="bracket" class="${SCO==='bracket'?'on':''}" style="${SCO==='bracket'?'':'color:#a9b4ac'}">대진표</button></div>`;
  const bindC=()=>$('#app').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{SCO=b.dataset.c;vScore();});
  const my=MYK||'';
  if(SCO==='bracket'){
    const sl=(o,i)=>`<span class="${o[i]?(o[i]===my?'me':''):'e'}">${esc(o[i]||'?')}</span>`;
    const h=Object.keys(B.bracket).map(k=>{const b=B.bracket[k],x=b.grades[G],o=x.order||[];const has=o.some(v=>v);
      let body='<div class="games">아직 추첨 전이에요</div>';
      if(has&&b.mode==='heat'){const n=o.filter(Boolean).length,z=b.size===2?(n<=4?[2,2]:[2,2,1]):(n<=3?[n]:[3,n-3]);let i=0;
        body=z.map((c,j)=>{const r=`<div class="order"><b class="gl">예선 ${j+1}조</b>${Array.from({length:c},(_,q)=>sl(o,i+q)).join('')}</div>`;i+=c;return r;}).join('')
          +`<div class="games">결승 — ${z.length===2?'각 조 1위 + 2위 중 기록 좋은 1반 (3반)':'각 조 1위'}</div>`;}
      else if(has){body=`<div class="order"><b class="gl">1경기</b>${sl(o,0)}${sl(o,1)}</div><div class="order"><b class="gl">2경기</b>${sl(o,2)}${sl(o,3)}</div>
          <div class="order"><b class="gl">3경기</b><span class="e">1경기 승</span>${sl(o,4)}</div><div class="games">${esc(o[4]||'5번')} 1회전 부전승 · 4경기 결승: 2경기 승 대 3경기 승</div>`;}
      return `<div class="bk card"><h3>${esc(b.name)} <small style="font-weight:700;color:var(--muted)">${b.mode==='heat'?'조 경주':'토너먼트'}</small></h3>${body}</div>`;}).join('');
    $('#app').innerHTML=`<div class="sb-h"><h1 id="htitle">대진표</h1><small>추첨 결과 · 우리 반은 파란색</small></div>${seg}${gchips()}${h||'<div class="note">대진표가 있는 종목이 없어요.</div>'}${footer()}`;
    bindC();bindG(vScore);return;
  }
  const S=B.scores.rows;
  const rows=CNs(G).map(n=>({k:G+'-'+n,...(S[G+'-'+n]||{total:0,rank:'',ranks:{},pts:{}})})).sort((a,b)=>b.total-a.total||a.k.localeCompare(b.k));
  const mx=Math.max(1,...rows.map(r=>r.total));
  const RK=(B.scores.events||[]).map(e=>[e.key,e.name]);
  const sw=k=>{const f=B.cfg.bantiShow&&(B.banti[k]||{}).fid;return `<div class="sw" ${f?`data-fid="${esc(f)}"`:''}>${shirt(k===my?'var(--blue)':'#dfe5df')}</div>`;};
  $('#app').innerHTML=`<div class="sb-h"><h1 id="htitle">${esc(B.year)} 실시간 점수판</h1><small>학년 안 순위 · ${esc(B.at.slice(11,16))} 기준</small>${B.scores.started?'<div class="live"><i></i>LIVE</div>':''}</div>${seg}${gchips()}
  ${B.scores.started?`<div class="rank">${rows.map(r=>`<div class="rk ${r.rank==='1'?'first':''} ${r.k===my?'mine':''}"><div class="n num">${esc(r.rank||'-')}</div>${sw(r.k)}
    <div><b>${esc(r.k)}${r.k===my?' <span class="pl b">우리 반</span>':''}</b><div class="bar"><i style="width:${r.total/mx*100}%"></i></div>
    <div class="chips">${RK.filter(x=>r.ranks[x[0]]).map(x=>`<span class="${r.ranks[x[0]]==='1'?'w':''}">${x[1]} ${r.ranks[x[0]]}위</span>`).join('')}</div></div>
    <div class="pt num">${r.total}<small>점</small></div></div>`).join('')}</div>`
  :`<div class="note">아직 경기 전이에요. 당일 경기가 끝날 때마다 점수가 여기에 올라와요.${(B.evAll||[]).filter(e=>e.score).length?'<br><br>배점 — '+(B.evAll||[]).filter(e=>e.score).map(e=>esc(e.name)+' '+e.pts.slice(0,3).map((p,i)=>(i+1)+'위 '+p).join('·')).join(' / '):''}</div>`}${footer()}`;
  bindC();bindG(vScore);
  $('#app').querySelectorAll('.sw[data-fid]').forEach(async el=>{const s=await photo(el.dataset.fid);if(s&&el.isConnected)el.innerHTML=`<img alt="" src="${s}">`;});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TAB==='score')refresh();});
setInterval(()=>{if(!document.hidden&&TAB==='score'&&SCO==='score'&&B&&B.scores.started)refresh();},30000);

/* ═══ 반티 모아 보기 ═══ */
function vBanti(){
  const head=`<div class="ph-h"><h1 id="htitle">우리 학교 반티</h1><p>우리 학교 반티 모아 보기 · 누르면 크게 보여요</p></div>`;
  if(!B.cfg.bantiShow){$('#app').innerHTML=head+`<div class="empty">반티는 선생님이 공개하면 여기에서 모두 볼 수 있어요.</div>${footer()}`;return;}
  const my=MYK||'';
  $('#app').innerHTML=head+gchips()+`<div class="gal">${CNs(G).map(n=>{const k=G+'-'+n,b=B.banti[k]||{};
    return `<button class="gc ${k===my?'mine':''}" data-k="${k}" ${b.fid?'':'disabled'}><div class="im" ${b.fid?`data-fid="${esc(b.fid)}"`:''}>${b.fid?'불러오는 중…':'아직 안 올렸어요'}</div>
      <div class="cap"><b>${esc(k)}</b><em style="${k===my?'color:var(--blue)':''}">${k===my?'우리 반':esc(b.teacher?b.teacher+' T':'')}</em></div></button>`;}).join('')}</div>${footer()}`;
  bindG(vBanti);
  $('#app').querySelectorAll('.im[data-fid]').forEach(async el=>{const s=await photo(el.dataset.fid);if(el.isConnected)el.innerHTML=s?`<img alt="" src="${s}">`:shirt('#dfe5df');});
  $('#app').querySelectorAll('.gc[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k,f=(B.banti[k]||{}).fid;if(!f)return;
    $('#bigT').textContent=k+' 반티';$('#bigI').src=PH[f]||'';$('#bigPh').classList.add('show');const s=await photo(f,'w1000');if(s&&$('#bigPh').classList.contains('show'))$('#bigI').src=s;});
}
$('#bigX').onclick=()=>$('#bigPh').classList.remove('show');
$('#bigPh').onclick=e=>{if(e.target.id==='bigPh')$('#bigPh').classList.remove('show');};

/* ═══ 응원 음원 ═══ */
const heart=on=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-8-5-8-11a5 5 0 019-3 5 5 0 019 3c0 6-8 11-8 11z"/></svg>`;
const ytId=u=>{u=String(u||'').trim();if(!u)return '';const m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);return m?m[1]:null;};
async function loadSongs(){const r=await get('songs',WHO?{sid:WHO.sid,dev:DEV}:{dev:DEV});if(!r.ok)throw new Error(r.msg);SONGS=r;}
async function vSong(){
  const head=`<div class="ph-h"><h1 id="htitle">응원 음원 추천</h1><p>경기 사이·점심시간에 틀 노래 · 하트가 많은 곡부터 틀어요</p></div>`;
  if(!SONGS){$('#app').innerHTML=head+'<div class="loading">불러오는 중…</div>'+footer();
    try{await loadSongs();}catch(e){if(TAB==='song')$('#app').innerHTML=head+'<div class="empty">연결이 안 돼요. 잠시 뒤 다시 열어 주세요.</div>'+footer();return;}
    if(TAB!=='song')return;}
  let L=SONGS.songs.slice();
  if(SGV==='likes')L.sort((a,b)=>b.likes-a.likes||b.id-a.id);else L.sort((a,b)=>b.id-a.id);
  if(SGV==='mine'&&WHO)L=L.filter(x=>x.mine);
  const left=Math.max(0,SONGS.dayMax-SONGS.usedToday);
  $('#app').innerHTML=head+`<div class="seg"><button data-v="likes" class="${SGV==='likes'?'on':''}">인기순</button><button data-v="new" class="${SGV==='new'?'on':''}">최신순</button>${WHO?`<button data-v="mine" class="${SGV==='mine'?'on':''}">내 추천</button>`:''}</div>
    ${SG_FRESH?`<div class="savedat ok" style="margin:8px 0 0">✅ 추천했어요 · ${esc(SG_FRESH)}</div>`:''}
    ${!SONGS.open?'<div class="rule">지금은 추천을 받지 않아요. 하트는 누를 수 있어요.</div>':''}
    <div class="sl">${L.map(x=>`<div class="sg ${x.id===SG_HL?'hl':''}" id="sg${x.id}">
      ${x.vid?`<a class="th" href="https://www.youtube.com/watch?v=${esc(x.vid)}" target="_blank" rel="noopener" aria-label="${esc(x.title)} 유튜브로 듣기"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/${esc(x.vid)}/mqdefault.jpg"><i></i></a>`
        :`<a class="th no" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.title+' '+x.artist)}" target="_blank" rel="noopener">유튜브에서<br>찾기</a>`}
      <div><b>${esc(x.title)}${x.played?'<span class="tg">틀었어요</span>':''}</b><p>${esc(x.artist)}${x.artist?' · ':''}${esc(x.key)} 추천${x.mine?' · 내 추천':''}</p></div>
      <button class="lk ${x.liked?'on':''}" data-id="${x.id}" aria-label="하트 ${x.likes}">${heart(x.liked)}<span class="num">${x.likes}</span></button></div>`).join('')
      ||`<div class="empty" style="margin:0">${SGV==='mine'?'아직 내가 추천한 곡이 없어요.':'아직 추천된 곡이 없어요. 첫 곡을 추천해 주세요!'}</div>`}</div>
    <div style="height:70px"></div>${footer()}
    ${SONGS.open?`<button class="fab" id="fab">＋ 추천하기${WHO?` <small style="opacity:.75;font-weight:700">· 오늘 ${left}곡 남음</small>`:''}</button>`:''}`;
  $('#app').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{SGV=b.dataset.v;SG_HL=0;vSong();});
  $('#app').querySelectorAll('.lk').forEach(b=>b.onclick=()=>like(+b.dataset.id,b));
  const f=$('#fab');f&&(f.onclick=openSheet);
  if(SG_HL){const el=$('#sg'+SG_HL);el&&el.scrollIntoView({block:'center',behavior:'smooth'});}
}
async function like(id,btn){
  const x=SONGS.songs.find(y=>y.id===id);if(!x)return;
  x.liked=!x.liked;x.likes+=x.liked?1:-1;btn.classList.toggle('on',x.liked);btn.innerHTML=heart(x.liked)+`<span class="num">${x.likes}</span>`;btn.disabled=true;
  try{const r=await post({a:'songLike',dev:DEV,id});btn.disabled=false;
    if(!r.ok){x.liked=!x.liked;x.likes+=x.liked?1:-1;btn.classList.toggle('on',x.liked);btn.innerHTML=heart(x.liked)+`<span class="num">${x.likes}</span>`;uiAlert(r.msg);return;}
    x.likes=r.likes;x.liked=r.liked;btn.innerHTML=heart(x.liked)+`<span class="num">${x.likes}</span>`;}
  catch(e){btn.disabled=false;x.liked=!x.liked;x.likes+=x.liked?1:-1;btn.classList.toggle('on',x.liked);btn.innerHTML=heart(x.liked)+`<span class="num">${x.likes}</span>`;toast('연결이 안 돼요');}
}
async function openSheet(){
  const left=WHO?Math.max(0,SONGS.dayMax-SONGS.usedToday):SONGS.dayMax;
  if(!left){uiAlert(`오늘은 ${SONGS.dayMax}곡을 다 추천했어요. 내일 또 추천해 주세요!\n마음에 드는 곡에 하트를 눌러 주세요.`);return;}
  ['#sgUrl','#sgTitle','#sgArtist'].forEach(s=>$(s).value='');$('#sgSid').value=WHO?WHO.sid:'';$('#sgName').value=WHO?WHO.name:'';$('#sgMsg').textContent='';$('#sgPv').classList.remove('show');
  $('#sgLim').textContent=`한 사람이 하루 ${SONGS.dayMax}곡까지${WHO?` · 오늘 ${left}곡 남았어요`:''} · 학교에 맞지 않는 곡은 선생님이 숨길 수 있어요`;
  $('#sgGo').disabled=false;$('#sgGo').textContent='추천 보내기';
  $('#sheet').classList.add('show');setTimeout(()=>$('#sgUrl').focus(),60);
}
function closeSheet(){$('#sheet').classList.remove('show');}
$('#sgNo').onclick=closeSheet;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
$('#sgUrl').oninput=()=>{const v=ytId($('#sgUrl').value);$('#sgMsg').textContent=v===null?'유튜브 주소가 아닌 것 같아요.':'';
  if(v){$('#sgPvI').src=`https://i.ytimg.com/vi/${v}/mqdefault.jpg`;$('#sgPv').classList.add('show');}else $('#sgPv').classList.remove('show');};
$('#sgGo').onclick=async()=>{
  const url=$('#sgUrl').value.trim(),title=$('#sgTitle').value.trim(),artist=$('#sgArtist').value.trim(),sid=$('#sgSid').value.trim(),name=$('#sgName').value.trim();
  if(!/^\d{4}$/.test(sid)||!name){$('#sgMsg').textContent='추천한 사람 — 학번 4자리와 이름을 넣어 주세요.';(sid?$('#sgName'):$('#sgSid')).focus();return;}
  if(ytId(url)===null){$('#sgMsg').textContent='유튜브 주소가 아닌 것 같아요. 비워 둬도 돼요.';return;}
  if(!title){$('#sgMsg').textContent='노래 제목을 넣어 주세요.';$('#sgTitle').focus();return;}
  $('#sgGo').disabled=true;$('#sgGo').textContent='보내는 중…';
  try{const r=await post({a:'songAdd',sid,name,dev:DEV,url,title,artist});
    if(!r.ok){$('#sgGo').disabled=false;$('#sgGo').textContent='추천 보내기';$('#sgMsg').textContent=r.msg;
      if(r.dupId){closeSheet();SG_HL=r.dupId;SGV='likes';toast('이미 있는 곡이에요 — 하트를 눌러 주세요');vSong();}return;}
    WHO={sid,name};ls.set('sd_who',WHO);SONGS=r;SG_FRESH=r.savedAt;SG_HL=r.added;SGV='new';closeSheet();toast('✅ 추천했어요');vSong();}
  catch(e){$('#sgGo').disabled=false;$('#sgGo').textContent='추천 보내기';$('#sgMsg').textContent='연결이 안 돼요. 다시 눌러 주세요.';}
};

/* 바닥글 제목은 머리 제목을 따라간다 */
new MutationObserver(()=>{const h=$('#htitle'),f=$('#ft');if(h&&f&&f.textContent!==h.textContent)f.textContent=h.textContent;document.title=(h?h.textContent+' · ':'')+'혜원 체육의 날';}).observe($('#app'),{childList:true,subtree:true,characterData:true});

/* ───── 시작 ───── */
(async()=>{
  try{B=await get('boot');if(!B.ok)throw new Error(B.msg);}
  catch(e){$('#app').innerHTML=`<div class="loading">연결이 안 돼요. 잠시 뒤 새로고침해 주세요.</div>${footer()}`;return;}
  const q=new URLSearchParams(location.search).get('tab');if(q)TAB=q;
  draw();
  setInterval(()=>{if(!document.hidden&&TAB==='time'&&SUB==='time'&&B.cfg.eventDate===kst().d)vTime();},60000);
})();
</script>
</body>
</html>
