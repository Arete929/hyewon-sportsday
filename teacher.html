<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>담임 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!--
  혜원 체육의 날 — 담임 확인 (교사용, GitHub Pages)
  @version 1.0.0
  [1.0.0] 반 대표 코드로 들어오면 그 반 담임(그 반만 편집, 다른 반은 보기만), 체육교사 마스터 코드로 들어오면 모든 반 편집.
          반별 자세히(반티 사진·종목 선수) · 반티 모아 보기(15개 반) · 선수 현황 표. 저장하면 시각과 저장한 사람을 보여 준다.
          앱스크립트는 JSON API(tLogin·tData·tSave·tBanti)로만 부른다. 마스터 코드는 서버에만 있다.
-->
<style>
:root{--blue:#1d4ed8;--blue-d:#173ea9;--blue-t:#e8eefc;--ok:#16884f;--ok-t:#e6f5ec;--warn:#b45a09;--warn-t:#fff3e2;--danger:#d63a48;--danger-t:#fdecee;
  --ink:#17211b;--ink2:#2b3a30;--muted:#55645a;--muted2:#7d8a80;--line:#e3e8e3;--line2:#d7ded8;--bg:#f5f7f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.5}
button,input{font-family:inherit}
.loading{color:var(--muted2);text-align:center;padding:80px 16px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:6}
.top .t small{display:block;color:var(--blue);font-weight:800;font-size:12px}.top .t b{font-size:19px;letter-spacing:-.01em}
.ver{font-size:11.5px;font-weight:800;background:var(--blue-t);color:var(--blue-d);border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:3px}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;background:#f7f9f8;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.me b{font-size:14px}.me small{display:block;font-size:11.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
.tag.ed{background:var(--ok-t);color:var(--ok)}.tag.ro{background:#eceeec;color:var(--muted)}.tag.ms{background:var(--blue);color:#fff}
.me button,.lnk{border:0;background:none;color:var(--blue);font-weight:800;font-size:13px;cursor:pointer;padding:6px}
main{max-width:1400px;margin:0 auto;padding:16px 24px 30px}
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.tabs button{height:38px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs .lnk{margin-left:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}.ph h3{margin:0;font-size:16px}.ph span{color:var(--muted);font-size:12.5px}
/* 반 버튼 줄 */
.cbar{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;position:sticky;top:68px;z-index:5}
.cg{display:flex;gap:5px;align-items:center;flex:1 1 0;min-width:0}.cg+.cg{border-left:1px solid var(--line);padding-left:10px}
.cgl{font-size:12px;font-weight:800;color:var(--muted2);white-space:nowrap;margin-right:2px}
.cb{flex:1 1 0;min-width:0;height:50px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink2)}
.cb b{font-size:15px;font-weight:900}.cb span{font-size:11px;color:var(--muted2);font-weight:700;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cb i{width:7px;height:7px;border-radius:50%;background:#d7ded8}.cb i.y{background:var(--ok)}
.cb.mine{border-color:var(--ok)}
.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}.cb.on span{color:#dfe7fb}.cb.on i{background:#fff}.cb.on i.y{background:#7ff0b0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 12px 4px}.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
/* 자세히 */
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dh .k{width:52px;height:52px;border-radius:13px;background:var(--blue-t);color:var(--blue-d);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.dh b{font-size:17px;display:block}.dh small{color:var(--muted);font-size:12.5px}.dh .tag{margin-left:auto}
.dg2{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.big{border-radius:12px;background:#eef1ee;display:grid;place-items:center;font-weight:700;color:var(--muted2);font-size:14px;min-height:240px;overflow:hidden;cursor:zoom-in}
.big img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#f3f5f3}
.big.none{cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{height:38px;padding:0 16px;border-radius:99px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center}
.btn.line{background:#fff;border:1.5px solid var(--line2);color:var(--ink2)}.btn:disabled{background:#c3cde3;cursor:default}
label.btn input{display:none}
.saved{font-size:12.5px;color:var(--muted2);margin-top:6px}.saved.ok{color:var(--ok);font-weight:700}.saved b{color:var(--ink2)}
.ro-note{font-size:12.5px;color:var(--muted);background:#f4f6f4;border-radius:8px;padding:7px 10px;margin-bottom:10px}
.evs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.evs button{height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer}
.evs button em{font-style:normal;margin-left:4px;opacity:.85}.evs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.evs button.full em{color:var(--ok)}.evs button.on.full em{color:#dff5e7}
.pk{display:flex;flex-wrap:wrap;gap:5px;min-height:40px;padding:7px;border-radius:10px;background:var(--blue-t);margin-bottom:8px}
.pk span{height:28px;display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 10px;border-radius:99px;background:var(--blue);color:#fff;font-size:13px;font-weight:700}
.pk span button{border:0;background:none;color:#fff;font-weight:800;cursor:pointer;padding:0 6px;font-size:13px}
.pk.ro span{padding:0 10px;background:#fff;color:var(--ink2);border:1px solid var(--line2)}
.pk em{font-style:normal;color:var(--muted2);font-size:13px;align-self:center;padding-left:4px}
.ros{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px}
.ros button{height:42px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;line-height:1.1}
.ros button small{display:block;font-size:10.5px;color:var(--muted2);font-weight:600}
.ros button.on{background:var(--blue);border-color:var(--blue);color:#fff}.ros button.on small{color:#dfe7fb}
.ros button.no{background:#f4f5f4;color:#b4bdb6;text-decoration:line-through;cursor:not-allowed}
.ros button.cf{border-style:dashed}
.rule{font-size:12px;color:var(--warn);background:var(--warn-t);border-radius:8px;padding:6px 10px;margin-top:8px}
.bad{font-size:12px;color:var(--danger);background:var(--danger-t);border-radius:8px;padding:6px 10px;margin-top:8px}
/* 반티 모아 보기 */
.galw{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px 8px;align-items:center}
.glh{font-size:13px;color:var(--muted2);font-weight:800}
.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gc{border:1.5px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;background:#fff;min-width:0}
.gc.mine{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-t)}
.gim{height:min(15vh,150px);border-radius:9px;background:#eef1ee;display:grid;place-items:center;color:var(--muted2);font-size:12.5px;font-weight:700;overflow:hidden;cursor:zoom-in}
.gim img{width:100%;height:100%;object-fit:cover;display:block}.gim.none{cursor:default}
.gcap{display:flex;align-items:center;gap:6px;min-width:0}.gcap b{font-size:14px}.gcap small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gcap .tag{margin-left:auto}
.gmeta{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .btn{height:28px;font-size:12px;justify-content:center}
/* 현황 표 */
.sum{width:100%;border-collapse:collapse;font-size:13px}.sum th,.sum td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.sum th{font-size:12px;color:var(--muted2);font-weight:700}.sum td:first-child,.sum th:first-child{text-align:left;font-weight:800}
.sum tr{cursor:pointer}.sum tr:hover td{background:#fafbfa}
.sum td.f{color:var(--ok);font-weight:800}.sum td.p{color:var(--warn);font-weight:800}.sum td.n{color:var(--muted2)}
.sum tr.mine td{background:#f2fbf5}.sum td.sv{font-size:12px;color:var(--muted);text-align:left}
/* 입장 */
.gate{max-width:460px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.gg{margin-bottom:8px}.gg b{font-size:12.5px;color:var(--muted2);display:block;margin-bottom:4px}
.cls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cls button{height:42px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-weight:800;color:var(--ink2);cursor:pointer;font-size:15px}
.cls button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.codein{display:block;width:100%;height:56px;border:1.5px solid var(--line2);border-radius:14px;text-align:center;font-size:26px;font-weight:900;letter-spacing:.3em;margin:14px 0;font-variant-numeric:tabular-nums}
.codein:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.big2{display:block;width:100%;height:52px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.big2:disabled{background:#c3cde3}
.hint{font-size:12.5px;color:var(--muted2);text-align:center;margin-top:10px;line-height:1.6}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:8px;min-height:1.2em}
.vf{text-align:center;font-size:11.5px;color:var(--muted2);padding:18px 0 6px;line-height:1.6}
/* 대화상자·토스트·크게 보기 */
.ov{position:fixed;inset:0;background:rgba(15,25,18,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.ov.show{display:flex}
.dlg{background:#fff;border-radius:16px;width:min(400px,100%);padding:20px}.dlg p{margin:0 0 14px;font-size:15px;white-space:pre-wrap;line-height:1.6}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.lb{position:fixed;inset:0;background:rgba(8,10,16,.85);display:none;align-items:center;justify-content:center;z-index:55;padding:50px 14px 14px}.lb.show{display:flex}
.lb img{max-width:96vw;max-height:calc(100vh - 70px);border-radius:8px;background:#fff}
.lb b{position:absolute;top:14px;left:16px;color:#fff;font-size:16px}.lb button{position:absolute;top:10px;right:12px;height:34px;padding:0 14px;border-radius:99px;border:0;background:#fff;font-weight:800;cursor:pointer}
@media (max-width:1100px){.cbar{flex-direction:column;gap:6px;position:static}.cg+.cg{border-left:0;padding-left:0}.dg2{grid-template-columns:1fr}.galw{grid-template-columns:1fr}.gim{height:auto;aspect-ratio:4/3}}
@media (max-width:1000px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.top{padding:10px 12px}.me{margin-left:0;width:100%}main{padding:12px 12px 24px}.cgl{width:30px;font-size:11px}.cb{height:44px}.cb b{font-size:13.5px}.cb span{font-size:10px}
  .gcap small,.gmeta{display:none}.gcap .tag{font-size:10px;padding:2px 6px}.gc .btn{font-size:11px;padding:0 6px}
  .sum td:first-child{white-space:nowrap}.sum th.sv,.sum td.sv{display:none}.sum th{font-size:11px}.sum td{padding:7px 4px}.big{min-height:180px}}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div class="ov" id="ov"><div class="dlg"><p id="dlgMsg"></p><div class="acts"><button class="btn line" id="dlgNo">취소</button><button class="btn" id="dlgOk">확인</button></div></div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><b id="lbT"></b><button id="lbX">닫기</button><img id="lbI" alt=""></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLj-YCN1PJIQ5r4KnbaLyeCD997tRVkZoKJQ9Y-Fan75w4xx-4YJjUGsMZ-binoVeN/exec';
const PAGE_VERSION='1.0.0',PAGE_DEPLOYED='2026-11-26 21:55';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(a,q){const r=await fetch(API+'?a='+a+(q?'&'+new URLSearchParams(q):''));return r.json();}
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json();}
let dlgRes=null;
function uiDialog(m,cancel){return new Promise(r=>{$('#dlgMsg').textContent=m;$('#dlgNo').style.display=cancel?'':'none';$('#ov').classList.add('show');dlgRes=r;setTimeout(()=>$('#dlgOk').focus(),30);});}
function dlgEnd(v){$('#ov').classList.remove('show');const r=dlgRes;dlgRes=null;r&&r(v);}
$('#dlgOk').onclick=()=>dlgEnd(true);$('#dlgNo').onclick=()=>dlgEnd(false);
document.addEventListener('keydown',e=>{if($('#ov').classList.contains('show')){if(e.key==='Enter')dlgEnd(true);if(e.key==='Escape')dlgEnd(false);}else if(e.key==='Escape')$('#lb').classList.remove('show');});
const uiAlert=m=>uiDialog(m,false),uiConfirm=m=>uiDialog(m,true);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
const ss={get(k){try{return JSON.parse(sessionStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const PH={};
async function photo(fid,size){if(!fid)return null;const ck=fid+(size||'');if(PH[ck])return PH[ck];
  try{const r=await get('photo',{fid,size:size||'w480'});if(r.ok){PH[ck]=`data:${r.mime};base64,${r.base64}`;return PH[ck];}}catch(e){}return null;}
function shrink(file,max=1400){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.86).split(',')[1]);};im.onerror=()=>rej(new Error('사진을 읽지 못했어요.'));im.src=fr.result;};fr.readAsDataURL(file);});}
const foot=()=>`<div class="vf"><span id="ft">담임 확인</span> · v${PAGE_VERSION} · 배포 ${PAGE_DEPLOYED} (KST)<br>ⓒKIMJINHO</div>`;

/* 상태 */
const S={auth:ss.get('sdt')||null,d:null,tab:'cls',sel:'',ev:'',pick:null,fresh:'',B:null,gk:''};
const C=k=>S.d.classes.find(c=>c.key===k);
const qOf=(e,k)=>e.q&&e.q[k]!=null?e.q[k]:e.quota;
const doneOf=c=>S.d.events.filter(e=>(c.players[e.key]||[]).length>=qOf(e,c.key)).length;
const nmOf=c=>{const m={};c.roster.forEach(s=>m[s.sid]=s.name);return m;};
const savedTxt=(t,by,fresh)=>t?`<div class="saved ${fresh?'ok':''}">${fresh?'✅ 저장됨':'마지막 저장'} · ${esc(t)}${by?' · <b>'+esc(by)+'</b>':''}</div>`:'<div class="saved">아직 저장 안 함</div>';

/* ─ 입장 ─ */
async function vGate(msg){
  if(!S.B){try{S.B=await get('bantiBoot');}catch(e){$('#app').innerHTML='<div class="loading">연결이 안 돼요. 잠시 뒤 새로고침해 주세요.</div>';return;}}
  const cn=g=>Math.max(1,Math.min(5,+((S.B.classN||{})[g])||5));
  $('#app').innerHTML=`<div class="gate"><h2>담임 선생님 확인</h2><p>우리 반을 고르고 반 대표 코드를 넣어 주세요. 우리 반은 고칠 수 있고, 다른 반은 볼 수 있어요.</p>
    ${[1,2,3].map(g=>`<div class="gg"><b>${g}학년</b><div class="cls">${Array.from({length:cn(g)},(_,i)=>g+'-'+(i+1)).map(k=>`<button data-k="${k}" class="${S.gk===k?'on':''}">${k}</button>`).join('')}</div></div>`).join('')}
    <input class="codein" id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="코드" maxlength="8">
    <button class="big2" id="go">${S.gk?S.gk+' 반으로 들어가기':'들어가기'}</button><div class="err" id="err">${esc(msg||'')}</div>
    <div class="hint">체육 선생님은 반을 고르지 않고 마스터 코드만 넣으면 돼요.</div>${foot()}</div>`;
  $('#app').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.gk=S.gk===b.dataset.k?'':b.dataset.k;const v=$('#code').value;vGate();$('#code').value=v;$('#code').focus();});
  const go=async()=>{const code=$('#code').value.replace(/\D/g,'');if(!code){$('#err').textContent='코드를 넣어 주세요.';return;}
    $('#go').disabled=true;$('#go').textContent='확인 중…';
    try{const r=await post({a:'tLogin',key:S.gk,code});if(!r.ok){$('#go').disabled=false;$('#go').textContent=S.gk?S.gk+' 반으로 들어가기':'들어가기';$('#err').textContent=r.msg;return;}
      S.auth={key:S.gk,code};ss.set('sdt',S.auth);S.d=r;S.sel=r.me.key||r.classes[0].key;S.tab='cls';vMain();}
    catch(e){$('#go').disabled=false;$('#go').textContent='들어가기';$('#err').textContent='연결이 안 돼요. 다시 눌러 주세요.';}};
  $('#go').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go();};
  setTimeout(()=>$('#code')&&$('#code').focus(),50);
}

/* ─ 본 화면 ─ */
function vMain(){
  const d=S.d,me=d.me,ms=me.role==='master';
  $('#app').innerHTML=`<header class="top"><div class="t"><small>${esc(d.year)} 혜원 체육의 날</small><b id="apptitle">담임 확인</b><span class="ver">v${PAGE_VERSION}</span></div>
    <div class="me"><div><b>${esc(me.name)}</b><small>${ms?'마스터 코드로 들어옴':'반 대표 코드로 들어옴'}</small></div><span class="tag ${ms?'ms':'ed'}">${ms?'모든 반 편집':me.key+' 편집 · 다른 반 보기'}</span><button id="out">나가기</button></div></header>
  <main><div class="tabs">${[['cls','반별 자세히'],['gal','반티 모아 보기'],['sum','선수 현황 표']].map(t=>`<button data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}<button class="lnk" id="re">새로 고침</button></div>
  <div id="body"></div>${foot()}</main>`;
  $('#out').onclick=async()=>{if(!await uiConfirm('나갈까요? 다시 들어오려면 코드를 넣어야 해요.'))return;ss.del('sdt');S.auth=null;S.d=null;S.pick=null;vGate();};
  $('#app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;vMain();scrollTo(0,0);});
  $('#re').onclick=()=>reload(true);
  ({cls:vCls,gal:vGal,sum:vSum})[S.tab]();
}
async function reload(say){try{const r=await post({a:'tData',key:S.auth.key,code:S.auth.code});if(!r.ok){await uiAlert(r.msg);ss.del('sdt');S.auth=null;vGate();return;}S.d=r;S.pick=null;vMain();if(say)toast('새로 불러왔어요');}catch(e){toast('연결이 안 돼요');}}

function cbar(){
  const gs=[...new Set(S.d.classes.map(c=>c.key[0]))].sort();
  return `<nav class="cbar">${gs.map(g=>`<div class="cg"><span class="cgl">${g}학년</span>${S.d.classes.filter(c=>c.key[0]===g).map(c=>`<button class="cb ${c.key===S.sel?'on':''} ${c.key===S.d.me.key?'mine':''}" data-c="${c.key}"><b>${c.key}</b><span><i class="${c.banti.fid?'y':''}"></i>${doneOf(c)}/${S.d.events.length}</span></button>`).join('')}</div>`).join('')}</nav>
  <div class="lg"><span><i style="background:var(--ok)"></i>반티 올림</span><span><i style="background:#d7ded8"></i>아직</span><span>숫자 = 선수를 다 채운 종목</span>${S.d.me.key?'<span><i style="background:none;border:1.5px solid var(--ok);width:9px;height:9px"></i>우리 반</span>':''}</div>`;
}
function vCls(){
  const c=C(S.sel)||S.d.classes[0];S.sel=c.key;
  const evs=S.d.events;if(!evs.some(e=>e.key===S.ev))S.ev=evs[0]?evs[0].key:'';
  const ev=evs.find(e=>e.key===S.ev),ed=c.edit,nm=nmOf(c),q=ev?qOf(ev,c.key):0;
  if(S.pick===null||S.pick.k!==c.key+ev.key)S.pick={k:c.key+ev.key,v:(c.players[ev.key]||[]).slice()};
  const P=S.pick.v,MAX=S.d.evMax==null?2:S.d.evMax;
  const other={};evs.forEach(e=>{if(e.key!==ev.key)(c.players[e.key]||[]).forEach(x=>(other[x]=other[x]||[]).push(e.key));});
  const gOf={};evs.forEach(e=>gOf[e.key]=e.grp);
  const dirty=JSON.stringify(P.slice().sort())!==JSON.stringify((c.players[ev.key]||[]).slice().sort());
  $('#body').innerHTML=cbar()+`<section class="panel"><div class="dh"><span class="k">${c.key}</span><div><b>${c.key}${c.teacher?' · '+esc(c.teacher)+' 선생님 반':''}</b><small>학생 ${c.size}명</small></div><span class="tag ${ed?'ed':'ro'}">${ed?'편집할 수 있어요':'보기만 해요'}</span></div>
    ${ed?'':'<div class="ro-note">다른 반은 보기만 할 수 있어요. 고칠 게 있으면 그 반 담임 선생님이나 체육 선생님께 알려 주세요.</div>'}
    <div class="dg2"><div><h4>반티 사진 ${c.banti.fid?'<span class="tag ed">올림</span>':'<span class="tag ro">아직</span>'}</h4>
      <div class="big ${c.banti.fid?'':'none'}" id="bimg">${c.banti.fid?'불러오는 중…':'아직 안 올렸어요'}</div>
      ${ed?`<div class="row"><label class="btn">${c.banti.fid?'사진 바꾸기':'사진 올리기'}<input type="file" accept="image/*" id="bfile"></label></div>`:''}
      ${c.banti.fid?savedTxt(c.banti.t,c.banti.by,S.fresh==='b'+c.key):''}</div>
    <div><h4>종목 선수</h4>
      <div class="evs">${evs.map(e=>{const n=(e.key===ev.key?P:(c.players[e.key]||[])).length,qq=qOf(e,c.key);return `<button data-e="${e.key}" class="${e.key===ev.key?'on':''} ${n>=qq?'full':''}">${esc(e.name)}<em>${n}/${qq}</em></button>`;}).join('')}</div>
      <div class="pk ${ed?'':'ro'}">${P.map(x=>`<span>${esc(nm[x]||x)}${ed?`<button data-x="${x}" aria-label="빼기">×</button>`:''}</span>`).join('')||'<em>아직 아무도 없어요</em>'}</div>
      ${ed?`<div class="ros">${c.roster.map(s=>{const on=P.includes(s.sid),o=other[s.sid]||[];const no=!on&&!!ev.grp&&o.some(k=>gOf[k]===ev.grp),cf=!on&&!no&&MAX>0&&o.length>=MAX;
        return `<button data-s="${s.sid}" class="${on?'on':no?'no':cf?'cf no':''}">${esc(s.name)}<small>${s.sid}</small></button>`;}).join('')||'<div class="ro-note">이 반 학생 명단이 아직 없어요.</div>'}</div>
        <div class="rule">${esc(S.d.evRule||'')} · 줄 그은 학생은 고를 수 없어요</div>
        <div class="row"><button class="btn" id="psave" ${dirty?'':'disabled'}>${esc(ev.name)} 저장</button>${dirty?'<button class="btn line" id="pundo">되돌리기</button>':''}</div>`:''}
      ${c.bad&&c.bad.length?`<div class="bad">규칙에 어긋난 학생 ${c.bad.length}명: ${c.bad.map(x=>esc(nm[x]||x)).join(', ')}</div>`:''}
      ${savedTxt(c.saved.t,c.saved.by,S.fresh==='p'+c.key)}</div></div></section>`;
  const B=$('#body');
  B.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{if(dirty&&!await uiConfirm('저장하지 않은 선수 고침이 있어요. 다른 반으로 갈까요?'))return;S.sel=b.dataset.c;S.pick=null;S.fresh='';vCls();});
  B.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{if(dirty&&!await uiConfirm('저장하지 않은 선수 고침이 있어요. 다른 종목으로 갈까요?'))return;S.ev=b.dataset.e;S.pick=null;S.fresh='';vCls();});
  B.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.pick.v=P.filter(x=>x!==b.dataset.x);vCls();});
  B.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const x=b.dataset.s;
    if(P.includes(x)){S.pick.v=P.filter(y=>y!==x);vCls();return;}
    if(b.classList.contains('cf')){toast('이미 '+MAX+'종목에 나가요');return;}
    if(b.classList.contains('no')){toast('같은 묶음 종목에 이미 나가요');return;}
    if(P.length>=q){toast(ev.name+'은(는) '+q+'명까지예요');return;}
    S.pick.v=P.concat(x);vCls();});
  const pu=$('#pundo');if(pu)pu.onclick=()=>{S.pick=null;vCls();};
  const ps=$('#psave');if(ps)ps.onclick=async()=>{ps.disabled=true;ps.textContent='저장 중…';
    try{const r=await post({a:'tSave',key:S.auth.key,code:S.auth.code,cls:c.key,ev:ev.key,sids:P});
      if(!r.ok){await uiAlert(r.msg);ps.disabled=false;ps.textContent=ev.name+' 저장';return;}
      S.d=r;S.pick=null;S.fresh='p'+c.key;toast('✅ 저장됨 · '+r.savedAt);vMain();}
    catch(e){ps.disabled=false;ps.textContent=ev.name+' 저장';uiAlert('연결이 안 돼요. 다시 눌러 주세요.');}};
  const bf=$('#bfile');if(bf)bf.onchange=async()=>{const f=bf.files[0];if(!f)return;
    if(c.banti.fid&&!await uiConfirm(c.key+' 반티 사진을 새 사진으로 바꿀까요?')){bf.value='';return;}
    toast('사진 올리는 중…');
    try{const b64=await shrink(f);const r=await post({a:'tBanti',key:S.auth.key,code:S.auth.code,cls:c.key,b64,mime:'image/jpeg'});
      if(!r.ok){await uiAlert(r.msg);return;}S.d=r;S.fresh='b'+c.key;toast('✅ 반티 사진 저장됨 · '+r.savedAt);vMain();}
    catch(e){uiAlert(String(e.message||'연결이 안 돼요. 다시 해 주세요.'));}};
  if(c.banti.fid)photo(c.banti.fid,'w1000').then(u=>{const el=$('#bimg');if(el&&S.sel===c.key){el.innerHTML=u?`<img alt="${c.key} 반티" src="${u}">`:'사진을 불러오지 못했어요';if(u)el.onclick=()=>big(c.key,c.banti.fid);}});
}
async function big(k,fid){$('#lbT').textContent=k+' 반티';$('#lbI').src=PH[fid+'w1000']||PH[fid+'w480']||'';$('#lb').classList.add('show');const u=await photo(fid,'w1000');if(u&&$('#lb').classList.contains('show'))$('#lbI').src=u;}
$('#lbX').onclick=()=>$('#lb').classList.remove('show');$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').classList.remove('show');};

function vGal(){
  const cs=S.d.classes,gs=[...new Set(cs.map(c=>c.key[0]))].sort(),n=cs.filter(c=>c.banti.fid).length;
  $('#body').innerHTML=`<section class="panel"><div class="ph"><h3>반티 모아 보기</h3><span>${cs.length}개 반 · 올린 반 ${n}/${cs.length} · 사진을 누르면 크게 보여요</span></div>
    <div class="galw">${gs.map(g=>`<b class="glh">${g}학년</b><div class="gal">${cs.filter(c=>c.key[0]===g).map(c=>`<div class="gc ${c.key===S.d.me.key?'mine':''}">
      <div class="gim ${c.banti.fid?'':'none'}" data-g="${c.key}">${c.banti.fid?'':'아직 안 올렸어요'}</div>
      <div class="gcap"><b>${c.key}</b><small>${esc(c.teacher||'')}${c.teacher?' T':''}</small>${c.banti.fid?'<span class="tag ed">올림</span>':'<span class="tag ro">아직</span>'}</div>
      <div class="gmeta">${c.banti.fid?esc(String(c.banti.t).slice(5,16))+(c.banti.by?' · '+esc(c.banti.by):''):'—'}</div>
      ${c.edit?`<button class="btn line" data-go="${c.key}">${c.banti.fid?'사진 바꾸기':'사진 올리기'}</button>`:''}</div>`).join('')}</div>`).join('')}</div></section>`;
  $('#body').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.go;S.tab='cls';S.pick=null;vMain();});
  cs.filter(c=>c.banti.fid).forEach(c=>photo(c.banti.fid,'w480').then(u=>{const el=$(`.gim[data-g="${c.key}"]`);if(!el)return;if(u){el.innerHTML=`<img alt="${c.key} 반티" src="${u}">`;el.onclick=()=>big(c.key,c.banti.fid);}else el.textContent='불러오지 못했어요';}));
}
function vSum(){
  const evs=S.d.events;
  $('#body').innerHTML=`<section class="panel"><div class="ph"><h3>종목별 선수 현황</h3><span>줄을 누르면 그 반을 열어요 · 초록=다 채움, 주황=채우는 중</span></div><div style="overflow-x:auto"><table class="sum">
    <tr><th>반</th>${evs.map(e=>`<th>${esc(e.name)}</th>`).join('')}<th class="sv">마지막 저장</th></tr>
    ${S.d.classes.map(c=>`<tr class="${c.key===S.d.me.key?'mine':''}" data-r="${c.key}"><td>${c.key}</td>${evs.map(e=>{const n=(c.players[e.key]||[]).length,qq=qOf(e,c.key);return `<td class="${n>=qq?'f':n?'p':'n'}">${n}/${qq}</td>`;}).join('')}
      <td class="sv">${c.saved.t?esc(String(c.saved.t).slice(5,16))+(c.saved.by?' · '+esc(c.saved.by):''):'—'}</td></tr>`).join('')}</table></div></section>`;
  $('#body').querySelectorAll('[data-r]').forEach(r=>r.onclick=()=>{S.sel=r.dataset.r;S.tab='cls';S.pick=null;vMain();});
}

/* 시작 — 같은 탭에서는 새로고침해도 들어온 채로 */
(async()=>{if(S.auth){try{const r=await post({a:'tData',key:S.auth.key,code:S.auth.code});if(r.ok){S.d=r;S.sel=r.me.key||r.classes[0].key;vMain();return;}}catch(e){}ss.del('sdt');S.auth=null;}vGate();})();
</script>
</body>
</html>
