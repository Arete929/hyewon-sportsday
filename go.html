<!-- 파일명: go.html | @version 1.2.0 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="img/logo64.png">
<title>2026 혜원 체육의 날</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!--
  혜원 체육의 날 — 학생 배부용 링크 모음 (GitHub Pages, 코드 없이 누구나)
  @version 1.2.0
  [1.2.0] 예전 사이트의 하단 메뉴(홈·시간표·선수·점수판·반티·음원) — 홈·반티는 이 페이지, 나머지는 index.html 의 그 탭.
  [1.1.0] 머리 제목 «2026 혜원 체육의 날»(빗썸고딕 기울임) + 학교 이름 작게 — 이제 이 페이지가 «학생 배부용 사이트».
  [1.0.1] 머리 아이콘을 혜원여중 교표(img/logo.webp)로, 탭 아이콘도 교표.
  [1.0.0] 배경: 가로 화면(PC·태블릿) img/bg_wide.webp, 세로 화면(폰) img/bg_tall.webp — 흰 막을 덮어 은은하게.
  [1.0.0] 링크트리처럼 큰 단추를 세로로. 지금은 «반티 갤러리» 하나(관리자 «학생 사이트에 공개»를 켰을 때 사진이 보인다).
          앱스크립트는 JSON API(boot·photo)로만 부른다 — 구글 주소 밖이라 만 13세 미만 계정 차단이 없다.
-->
<style>
@font-face{font-family:'BithumbGothicOriginal';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610082345@original/original/Bithumb%20Gothic%20Original.woff2') format('woff2');font-weight:700;font-style:italic;font-display:swap}
:root{--blue:#1d4ed8;--blue-d:#173ea9;--blue-t:#e8eefc;--ok:#16884f;--ok-t:#e6f5ec;--ink:#17211b;--ink2:#2b3a30;--muted:#55645a;--muted2:#7d8a80;--line:#e3e8e3;--line2:#d7ded8;--bg:#f5f7f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url(img/bg_wide.webp) center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(245,247,244,.72),rgba(245,247,244,.86) 45%,rgba(245,247,244,.92))}
@media (orientation:portrait){body::before{background-image:url(img/bg_tall.webp)}}
body{position:relative;z-index:0}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;border-top:1px solid var(--line);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{display:flex;width:100%;max-width:520px;height:62px}
.tabs a{flex:1;text-decoration:none;font-weight:700;font-size:11.5px;color:var(--muted2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9}
.tabs a.on{color:var(--blue)}
@media (max-width:360px){.tabs a{font-size:11px}}
.hero{padding:34px 4px 20px;text-align:center}
.hero .mk{width:84px;height:84px;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 10px rgba(20,40,30,.18))}
.hero small{display:block;color:var(--blue);font-weight:800;font-size:13px}
.hero h1{margin:2px 0 2px;font-family:'BithumbGothicOriginal',Pretendard,sans-serif;font-style:italic;font-weight:700;font-size:30px;letter-spacing:-.01em}
.hero small.sch{color:var(--muted);font-weight:700;margin-bottom:8px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.dd{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;font-weight:900;font-size:14px;border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lk{box-shadow:0 2px 10px rgba(20,40,30,.06);display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 16px;border-radius:18px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left;color:inherit;font:inherit;text-decoration:none}
.lk:hover{border-color:var(--line2)}
.lk .ic{width:46px;height:46px;border-radius:13px;background:var(--blue-t);display:grid;place-items:center;flex:none}
.lk .ic svg{width:24px;height:24px;fill:none;stroke:var(--blue-d);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk b{display:block;font-size:16.5px}.lk span{display:block;font-size:13px;color:var(--muted)}
.lk .go{margin-left:auto;color:var(--muted2);font-size:20px}
.lk.soon{opacity:.55;cursor:default}
.top{display:flex;align-items:center;gap:8px;padding:16px 0 12px;position:sticky;top:0;background:rgba(245,247,244,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:3}
.top button{height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:13.5px;color:var(--ink2);cursor:pointer}
.top h2{margin:0 0 0 4px;font-size:18px}
.gch{display:flex;gap:6px;margin:0 0 12px}
.gch button{flex:1;height:38px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.gch button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;padding:0;font:inherit;color:inherit;text-align:left}
.gc .im{aspect-ratio:3/4;background:#eef1ee;display:grid;place-items:center;color:var(--muted2);font-size:13px;font-weight:700}
.gc .im img{width:100%;height:100%;object-fit:cover;display:block}
.gc .cap{padding:8px 10px;display:flex;align-items:baseline;gap:6px}.gc .cap b{font-size:15px}.gc .cap small{color:var(--muted);font-size:12px}
.gc[disabled]{cursor:default}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.vf{text-align:center;font-size:11.5px;color:var(--muted2);padding:22px 0 4px;line-height:1.6}
.loading{color:var(--muted2);text-align:center;padding:60px 0}
.lb{position:fixed;inset:0;background:rgba(8,10,16,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:54px 12px 12px}.lb.show{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 70px);border-radius:10px;background:#fff}
.lb b{position:absolute;top:16px;left:16px;color:#fff;font-size:16px}.lb button{position:absolute;top:10px;right:12px;height:36px;padding:0 16px;border-radius:99px;border:0;background:#fff;font-weight:800;font-size:14px;cursor:pointer}
.gh{margin:14px 0 8px 2px;font-size:14px;color:var(--muted)}.gh:first-of-type{margin-top:0}
@media (min-width:600px){.app{max-width:760px}.gal{grid-template-columns:repeat(3,minmax(0,1fr))}.links{max-width:520px;margin-left:auto;margin-right:auto}}
@media (min-width:900px){.app{max-width:1100px}.gal{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">불러오는 중…</div></div>
<nav class="tabs" id="tabs"><div>
  <a href="go.html" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>홈</a>
  <a href="index.html?tab=time" data-t="time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>시간표·선수</a>
  <a href="index.html?tab=score" data-t="score"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4"/></svg>점수판</a>
  <a href="go.html#banti" data-t="banti"><svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 01-8 0z"/></svg>반티</a>
  <a href="index.html?tab=song" data-t="song"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>음원</a>
</div></nav>
<div class="lb" id="lb"><b id="lbT"></b><button id="lbX">닫기</button><img id="lbI" alt=""></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLj-YCN1PJIQ5r4KnbaLyeCD997tRVkZoKJQ9Y-Fan75w4xx-4YJjUGsMZ-binoVeN/exec';
const PAGE_VERSION='1.2.0',PAGE_DEPLOYED='2026-11-27 10:58';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(a,q){const r=await fetch(API+'?a='+a+(q?'&'+new URLSearchParams(q):''));return r.json();}
const PH={};
async function photo(fid,size){if(!fid)return null;const k=fid+size;if(PH[k])return PH[k];
  try{const r=await get('photo',{fid,size});if(r.ok){PH[k]=`data:${r.mime};base64,${r.base64}`;return PH[k];}}catch(e){}return null;}
const foot=()=>`<div class="vf">${esc(B?B.year+' ':'')}혜원 체육의 날 · v${PAGE_VERSION} · 배포 ${PAGE_DEPLOYED} (KST)<br>ⓒKIMJINHO</div>`;
const IC={banti:'<path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 01-8 0z"/>'};
let B=null,G=localStorage.getItem('sdg_g')||'1';
function dday(){const d=B&&B.cfg.eventDate;if(!d)return '';const t=new Date(),k=new Date(t.getTime()+9*3600e3).toISOString().slice(0,10);const n=Math.round((new Date(d)-new Date(k))/864e5);return n>0?'D-'+n:n===0?'오늘이에요!':'';}
function whenTxt(){const d=B&&B.cfg.eventDate;if(!d)return '';const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}월 ${x.getDate()}일 (${'일월화수목금토'[x.getDay()]}) ${esc(B.cfg.startTime||'')} · ${esc(B.cfg.place||'')}`;}
function vHome(){
  const dd=dday(),n=B?Object.values(B.banti||{}).filter(x=>x.fid).length:0;
  $('#app').innerHTML=`<div class="hero"><img class="mk" src="img/logo.webp" alt="혜원여자중학교 교표" width="84" height="84">
    <h1>${esc(B?B.year:'')} 혜원 체육의 날</h1><small class="sch">혜원여자중학교</small><p>${whenTxt()}</p>${dd?`<span class="dd">${dd}</span>`:''}</div>
  <div class="links">
    <button class="lk" data-go="banti"><span class="ic"><svg viewBox="0 0 24 24">${IC.banti}</svg></span><span><b>반티 갤러리</b><span>${B&&B.cfg.bantiShow?`우리 학교 반티 모아 보기 · ${n}반 올림`:'반티가 공개되면 여기서 볼 수 있어요'}</span></span><span class="go">›</span></button>
  </div>${foot()}`;
  $('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;});
}
function vBanti(){
  const show=B&&B.cfg.bantiShow;
  const cn=g=>Math.max(1,Math.min(5,+((B.cfg.classN||{})[g])||5)),wide=matchMedia('(min-width:900px)').matches;
  const card=k=>{const b=(B.banti||{})[k]||{};return `<button class="gc" data-k="${k}" ${b.fid?'':'disabled'}><div class="im" data-fid="${esc(b.fid||'')}">${b.fid?'불러오는 중…':'아직 안 올렸어요'}</div><div class="cap"><b>${k}</b><small>${esc(b.teacher?b.teacher+' 선생님':'')}</small></div></button>`;};
  const grade=g=>`<div class="gal">${Array.from({length:cn(g)},(_,i)=>g+'-'+(i+1)).map(card).join('')}</div>`;
  $('#app').innerHTML=`<div class="top"><button id="back">‹ 처음</button><h2>반티 갤러리</h2></div>
    ${show?(wide?[1,2,3].map(g=>`<h3 class="gh">${g}학년</h3>${grade(g)}`).join(''):`<div class="gch">${[1,2,3].map(g=>`<button data-g="${g}" class="${G===String(g)?'on':''}">${g}학년</button>`).join('')}</div>${grade(+G)}`)
    :'<div class="note">반티는 선생님이 공개하면 여기에서 모두 볼 수 있어요.</div>'}${foot()}`;
  $('#back').onclick=()=>{location.hash='';};
  $('#app').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{G=b.dataset.g;try{localStorage.setItem('sdg_g',G)}catch(e){}vBanti();});
  $('#app').querySelectorAll('.im[data-fid]').forEach(async el=>{const f=el.dataset.fid;if(!f)return;const u=await photo(f,'w480');if(el.isConnected)el.innerHTML=u?`<img alt="" src="${u}">`:'불러오지 못했어요';});
  $('#app').querySelectorAll('.gc[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k,f=((B.banti||{})[k]||{}).fid;if(!f)return;
    $('#lbT').textContent=k+' 반티';$('#lbI').src=PH[f+'w480']||'';$('#lb').classList.add('show');const u=await photo(f,'w1000');if(u&&$('#lb').classList.contains('show'))$('#lbI').src=u;});
}
$('#lbX').onclick=()=>$('#lb').classList.remove('show');$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').classList.remove('show');};
let _w=innerWidth>=900;addEventListener('resize',()=>{const w=innerWidth>=900;if(w!==_w){_w=w;if(location.hash==='#banti')vBanti();}});
function route(){scrollTo(0,0);const bt=location.hash==='#banti';document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===(bt?'banti':'home')));(bt?vBanti:vHome)();}
window.addEventListener('hashchange',route);
(async()=>{try{B=await get('boot');if(!B.ok)throw 0;}catch(e){$('#app').innerHTML='<div class="loading">연결이 안 돼요. 잠시 뒤 새로고침해 주세요.</div>';return;}route();})();
</script>
</body>
</html>
